<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AWebShop — Marketplace for websites</title>

<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="aw-body">
<div id="aw-header"></div>

<main class="aw-page">
  <!-- HERO -->
  <section class="aw-hero">
    <div class="aw-hero-text">
      <h1>Buy and sell real websites</h1>
      <p>Escrow-protected transactions. Pay in AWC, UZS, or USD.</p>
      <div class="aw-hero-actions">
        <a class="aw-btn aw-btn-primary" href="store.html">Explore Store</a>
        <a class="aw-btn aw-btn-ghost" href="sell.html">Sell a Website</a>
      </div>
    </div>
    <div class="aw-hero-badge">
      <div>AWC</div>
      <small id="awc-rate">1 AWC = 10,000 so'm</small>
    </div>
  </section>

  <!-- EVENTS -->
  <section class="aw-section" id="events-section">
    <div class="aw-section-head">
      <h2 id="events-title">Latest Events</h2>
      <div class="aw-events-dots" id="events-dots"></div>
    </div>
    <div class="aw-events-rotator" id="events-area">
      <div class="aw-event-skel">Events will appear here once admins add them.</div>
    </div>
  </section>

  <!-- RECOMMENDED -->
  <section class="aw-section">
    <div class="aw-section-head">
      <h2 id="recommended-title">Recommended Websites</h2>
      <a class="aw-link" href="store.html">See all →</a>
    </div>
    <div class="aw-grid" id="recommended-grid">
      <div class="aw-loading">Loading…</div>
    </div>
  </section>

  <!-- PREMIUM PLANS -->
  <section class="aw-section">
    <div class="aw-section-head">
      <h2>Premium Plans</h2>
      <a class="aw-link" href="wallet.html#premium">See all →</a>
    </div>
    <div class="aw-grid aw-grid-plans" id="plans-grid">
      <div class="aw-loading">Loading…</div>
    </div>
  </section>
</main>

<div id="aw-footer"></div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../components/header.js"></script>
<script src="../components/footer.js"></script>
<script src="../components/website-card.js"></script>
<script src="../js/shortcuts.js"></script>

<script>
(function () {
  'use strict';

  function safeT(k) {
    if (window.I18N && typeof window.I18N.t === 'function') return window.I18N.t(k);
    if (typeof window.t === 'function') return window.t(k);
    return k;
  }
  function fmtUZS(n) { return (window.fmtUZS || (x => new Intl.NumberFormat('uz-UZ').format(Math.round(x || 0)) + " so'm"))(n); }
  function fmtUSD(n) { return (window.fmtUSD || (x => '$' + Number(x || 0).toFixed(2)))(n); }
  function fmtAWC(n) { return (window.fmtAWC || (x => Number(x || 0).toFixed(4).replace(/\.?0+$/, '') + ' AWC'))(n); }
  function esc(s) {
    if (typeof window.esc === 'function') return window.esc(s);
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  async function init() {
    try { if (typeof window.loadRates === 'function') await window.loadRates(); } catch (_) {}

    // AWC rate
    const rateEl = document.getElementById('awc-rate');
    if (rateEl && window.RATES) {
      const awcRate = window.RATES.awcPriceUZS || 10000;
      const usdRate = window.RATES.usdRate || 12650;
      rateEl.textContent = '1 AWC = ' + fmtUZS(awcRate) + '  •  ' + fmtUSD(awcRate / usdRate);
    }

    const evTitle = document.getElementById('events-title');
    const recTitle = document.getElementById('recommended-title');
    if (evTitle) evTitle.textContent = safeT('latestEvents');
    if (recTitle) recTitle.textContent = safeT('recommended');

    loadPublicEvents();
    loadRecommended();
    loadPremiumPlans();
  }

  // EVENTS
  let eventsTimer = null;
  async function loadPublicEvents() {
    const host = document.getElementById('events-area');
    const dots = document.getElementById('events-dots');
    if (!host || !dots) return;

    let res = null;
    try {
      if (window.API && typeof window.API.request === 'function') {
        res = await window.API.request('/api/events', { auth: false });
      }
    } catch (_) {}

    if (!res || !res.success || !res.data || !Array.isArray(res.data.items) || !res.data.items.length) {
      host.innerHTML = '<div class="aw-event-skel">Events will appear here once admins add them.</div>';
      dots.innerHTML = '';
      return;
    }

    const items = res.data.items.slice(0, 6);

    host.innerHTML = items.map((e, i) => `
      <div class="aw-event-slide ${i === 0 ? 'active' : ''}" data-i="${i}">
        ${e.imageUrl ? `<img src="${esc(e.imageUrl)}" alt="${esc(e.title || '')}" onerror="this.style.display='none'"/>` : ''}
        <h3>${esc(e.title || '')}</h3>
        <p>${esc(e.description || '')}</p>
        ${e.link ? `<a class="aw-btn aw-btn-ghost" href="${esc(e.link)}" target="_blank" rel="noopener">Open →</a>` : ''}
      </div>
    `).join('');

    dots.innerHTML = items.map((_, i) => `<span class="${i === 0 ? 'active' : ''}" data-dot="${i}"></span>`).join('');

    let current = 0;
    function show(i) {
      current = (i + items.length) % items.length;
      host.querySelectorAll('.aw-event-slide').forEach((el, idx) => el.classList.toggle('active', idx === current));
      dots.querySelectorAll('span').forEach((el, idx) => el.classList.toggle('active', idx === current));
    }
    dots.querySelectorAll('span').forEach(s => {
      s.addEventListener('click', () => { show(Number(s.dataset.dot)); restart(); });
    });
    function restart() {
      if (eventsTimer) clearInterval(eventsTimer);
      eventsTimer = setInterval(() => show(current + 1), 5000);
    }
    restart();
  }

  // RECOMMENDED
  async function loadRecommended() {
    const grid = document.getElementById('recommended-grid');
    if (!grid) return;
    try {
      const res = await window.API.listWebsites({ page: 1, perPage: 8, sort: 'popular' });
      if (res && res.success && res.data && Array.isArray(res.data.items) && res.data.items.length) {
        grid.innerHTML = res.data.items.map(window.websiteCard).join('');
      } else {
        grid.innerHTML = '<div class="aw-empty">No websites yet. Be the first to sell!</div>';
      }
    } catch (e) {
      console.warn('[main]', e.message);
      grid.innerHTML = '<div class="aw-empty">Failed to load.</div>';
    }
  }

  // PREMIUM PLANS
  async function loadPremiumPlans() {
    const grid = document.getElementById('plans-grid');
    if (!grid) return;
    try {
      const res = await window.API.premiumPlans();
      if (!res || !res.success || !Array.isArray(res.data.items)) {
        grid.innerHTML = '<div class="aw-empty">Premium plans unavailable.</div>';
        return;
      }
      grid.innerHTML = res.data.items.map(p => `
        <div class="aw-plan-card">
          <h3>${esc(p.name)}</h3>
          <div class="aw-plan-price">
            <strong>${fmtUZS(p.monthlyPriceUZS)}</strong>
            <small>${fmtUSD(p.monthlyPriceUSD)} / month</small>
          </div>
          <ul class="aw-plan-features">
            ${Array.isArray(p.features) ? p.features.map(f => `<li>${esc(f)}</li>`).join('') : ''}
          </ul>
          <div class="aw-plan-commission">${esc(p.commission)}% commission</div>
          <button class="aw-btn aw-btn-primary aw-btn-block" data-plan="${esc(p.id)}">Choose ${esc(p.name)}</button>
        </div>
      `).join('');

      grid.querySelectorAll('button[data-plan]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (!window.Auth || !window.Auth.isLoggedIn()) {
            location.href = 'login.html?next=wallet.html';
            return;
          }
          location.href = 'wallet.html#premium';
        });
      });
    } catch (e) {
      console.warn('[main]', e.message);
      grid.innerHTML = '<div class="aw-empty">Failed.</div>';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
