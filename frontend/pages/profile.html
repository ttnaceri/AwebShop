<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Profile — AWebShop<title>
  <link rel="icon" type="image/png" href="/frontend/assets/image/logo.png">
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="aw-body">
<div id="aw-header"></div>

<main class="aw-page">
  <div class="aw-profile-head">
    <div class="aw-avatar aw-avatar-lg" id="p-avatar">?</div>
    <div>
      <h1 id="p-nick">…</h1>
      <div class="aw-muted">
        ID: <code id="p-id"></code> • ⭐ <span id="p-rating">0.0</span> • <span id="p-verified"></span>
      </div>
      <div class="aw-muted">AWC: <strong id="p-balance">0</strong></div>
    </div>
  </div>

  <div class="aw-tabs">
    <button class="aw-tab active" data-tab="dashboard">Dashboard</button>
    <button class="aw-tab" data-tab="orders">Orders</button>
    <button class="aw-tab" data-tab="transactions">Transactions</button>
    <button class="aw-tab" data-tab="messages">Messages</button>
    <button class="aw-tab" data-tab="promocodes">Promocodes</button>
    <button class="aw-tab" data-tab="support">Support</button>
    <button class="aw-tab" data-tab="faq">FAQ</button>
    <button class="aw-tab" data-tab="terms">Terms & Privacy</button>
    <button class="aw-tab" data-tab="settings">Settings</button>
  </div>

  <div id="tab-content" class="aw-tab-content"></div>
</main>

<div id="aw-footer"></div>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/validation.js"></script>
<script src="../components/header.js"></script>
<script src="../components/footer.js"></script>
<script src="../components/modals.js"></script>
<script src="../js/shortcuts.js"></script>

<script>
(async () => {
  await loadRates();
  await Auth.load();
  if (!Auth.requireLogin('profile.html')) return;

  const user = Auth.user;

  document.getElementById('p-avatar').textContent = (user.nickname || '?')[0].toUpperCase();
  document.getElementById('p-nick').textContent = user.nickname;
  document.getElementById('p-id').textContent = user.id;
  document.getElementById('p-rating').textContent = (user.rating || 0).toFixed(1);
  document.getElementById('p-verified').textContent = user.verified ? 'Verified ✔' : 'Not verified';
  document.getElementById('p-balance').textContent = fmtAWC(user.balanceAWC);

  const content = document.getElementById('tab-content');

  async function renderTab(name) {
    document.querySelectorAll('.aw-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));

    if (name === 'dashboard') return renderDashboard();
    if (name === 'orders') return renderOrders();
    if (name === 'transactions') return renderTransactions();
    if (name === 'messages') return renderMessages();
    if (name === 'promocodes') return renderPromocodes();
    if (name === 'support') return renderSupport();
    if (name === 'faq') return renderFaq();
    if (name === 'terms') return renderTerms();
    if (name === 'settings') return renderSettings();
  }

  function renderDashboard() {
    content.innerHTML = `
      <div class="aw-grid aw-grid-2">
        <div class="aw-card-static">
          <h3>Total spent</h3>
          <div class="aw-big">${fmtUZS(user.totalSpent || 0)}</div>
        </div>
        <div class="aw-card-static">
          <h3>Total earned</h3>
          <div class="aw-big">${fmtUZS(user.totalEarned || 0)}</div>
        </div>
      </div>
      <div class="aw-section">
        <h3>My websites</h3>
        <div id="dash-sites" class="aw-grid"><div class="aw-loading">…</div></div>
      </div>
    `;
    API.myWebsites().then(r => {
      const el = document.getElementById('dash-sites');
      if (!r.success || !r.data.items.length) {
        el.innerHTML = '<div class="aw-empty">No listings yet.</div>';
        return;
      }
      el.innerHTML = r.data.items.map(w => `
        <div class="aw-card-static">
          <div><strong>${esc(w.name)}</strong></div>
          <div class="aw-muted">${esc(w.domain)}</div>
          <div>${fmtUZS(w.priceUZS)} — <span class="aw-status aw-status-${esc(w.status)}">${esc(w.status)}</span></div>
          <div><a class="aw-link" href="website-detail.html?id=${esc(w.webId)}">Open →</a></div>
        </div>
      `).join('');
    });
  }

  async function renderOrders() {
    content.innerHTML = '<div class="aw-loading">Loading orders…</div>';
    // Hozircha orders endpoint yo'q — transactions dan ajratib ko'rsatamiz.
    const r = await API.myTransactions();
    const orders = (r.success ? r.data.items : []).filter(t => t.type.startsWith('order'));
    content.innerHTML = `
      <div class="aw-table-wrap"><table class="aw-table">
        <thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead>
        <tbody>${orders.length ? orders.map(t => `
          <tr><td>${fmtDate(t.createdAt)}</td><td>${esc(t.type)}</td><td>${fmtUZS(t.amountUZS)}</td><td>${esc(t.status)}</td></tr>
        `).join('') : '<tr><td colspan="4" class="aw-muted">No orders yet.</td></tr>'}</tbody>
      </table></div>
    `;
  }

  async function renderTransactions() {
    content.innerHTML = '<div class="aw-loading">Loading…</div>';
    const r = await API.myTransactions();
    if (!r.success) { content.innerHTML = '<div class="aw-empty">Failed.</div>'; return; }
    content.innerHTML = `
      <div class="aw-table-wrap"><table class="aw-table">
        <thead><tr><th>Date</th><th>Type</th><th>AWC</th><th>UZS</th><th>Status</th></tr></thead>
        <tbody>${r.data.items.length ? r.data.items.map(t => `
          <tr>
            <td>${fmtDate(t.createdAt)}</td>
            <td>${esc(t.type)}</td>
            <td>${t.amountAWC ? fmtAWC(t.amountAWC) : '—'}</td>
            <td>${t.amountUZS ? fmtUZS(t.amountUZS) : '—'}</td>
            <td><span class="aw-status aw-status-${esc(t.status)}">${esc(t.status)}</span></td>
          </tr>
        `).join('') : '<tr><td colspan="5" class="aw-muted">No transactions.</td></tr>'}</tbody>
      </table></div>
    `;
  }

  function renderMessages() {
    content.innerHTML = `
      <div class="aw-empty">
        Direct messaging will appear here. Use Telegram or admin support for urgent matters.
      </div>
    `;
  }

  function renderPromocodes() {
    content.innerHTML = `
      <div class="aw-empty">No active promocodes for your account.</div>
    `;
  }

  function renderSupport() {
    content.innerHTML = `
      <form class="aw-form aw-form-narrow" id="support-form">
        <label><span>Message to support/admin</span><textarea id="sup-msg" rows="5" required></textarea></label>
        <button class="aw-btn aw-btn-primary" type="submit">Send</button>
      </form>
      <p class="aw-muted">Messages are delivered to admin notifications. Telegram support also available.</p>
    `;
    document.getElementById('support-form').addEventListener('submit', e => {
      e.preventDefault();
      const msg = document.getElementById('sup-msg').value.trim();
      if (!msg) return;
      toast('Your message was queued for admin review.', 'success');
      document.getElementById('sup-msg').value = '';
    });
  }

  function renderFaq() {
    content.innerHTML = `
      <details><summary>How does Safe (escrow) work?</summary><p>Admin holds funds until you confirm the delivered website.</p></details>
      <details><summary>How do I top up AWC?</summary><p>Wallet → Top up. Admin verifies your manual card payment.</p></details>
      <details><summary>How many Premium plans are there?</summary><p>Four: Plus, Prime, Pro, Enterprise.</p></details>
      <details><summary>How is USD rate determined?</summary><p>From the configured exchange-rate provider, cached in backend.json.</p></details>
    `;
  }

  function renderTerms() {
    content.innerHTML = `
      <p class="aw-muted">By using AWebShop you agree to the platform rules. Fast transactions have fewer protections than Safe transactions. Manual payments are verified by admin. Bad listings are moderated automatically according to configured rules.</p>
    `;
  }

  function renderSettings() {
    content.innerHTML = `
      <form class="aw-form aw-form-narrow" id="settings-form">
        <label><span>Nickname (changeable once per 2 weeks)</span><input id="st-nick" value="${esc(user.nickname)}"/></label>
        <label><span>Language</span>
          <select id="st-lang">
            <option value="en" ${user.language === 'en' ? 'selected' : ''}>English</option>
            <option value="uz" ${user.language === 'uz' ? 'selected' : ''}>O'zbekcha</option>
          </select>
        </label>
        <label><span>Currency</span>
          <select id="st-cur">
            <option value="UZS" ${user.currency === 'UZS' ? 'selected' : ''}>UZS</option>
            <option value="USD" ${user.currency === 'USD' ? 'selected' : ''}>USD</option>
          </select>
        </label>
        <label class="aw-checkbox">
          <input type="checkbox" id="st-dark" ${user.darkMode ? 'checked' : ''}/>
          <span>Dark mode</span>
        </label>
        <div class="aw-form-error" id="st-err" hidden></div>
        <button class="aw-btn aw-btn-primary" type="submit">Save</button>
      </form>
    `;
    document.getElementById('settings-form').addEventListener('submit', async e => {
      e.preventDefault();
      const payload = {
        nickname: document.getElementById('st-nick').value.trim(),
        language: document.getElementById('st-lang').value,
        currency: document.getElementById('st-cur').value,
        darkMode: document.getElementById('st-dark').checked
      };
      const r = await API.updateProfile(payload);
      if (r.success) {
        Auth.user = r.data.user;
        localStorage.setItem('aw_theme', payload.darkMode ? 'dark' : 'light');
        localStorage.setItem('aw_lang', payload.language);
        toast('Saved.', 'success');
        setTimeout(() => location.reload(), 500);
      } else {
        const e2 = document.getElementById('st-err');
        e2.textContent = r.message; e2.hidden = false;
      }
    });
  }

  document.querySelectorAll('.aw-tab').forEach(b => {
    b.addEventListener('click', () => renderTab(b.dataset.tab));
  });

  const hash = location.hash.replace('#', '') || 'dashboard';
  renderTab(hash);
})();
</script>
</body>
</html>
