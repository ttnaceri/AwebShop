<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Profile — AWebShop</title>

<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="aw-body">

<header class="aw-navbar">
  <div class="aw-navbar-inner">
    <a class="aw-navbar-brand" href="main.html">
      <img src="../assets/image/logo.png" alt="AWebShop" onerror="this.style.display='none'"/>
      <span>AWebShop</span>
    </a>
    <nav class="aw-navbar-links">
      <a href="main.html"><i class="fa-solid fa-house"></i> Home</a>
      <a href="store.html"><i class="fa-solid fa-store"></i> Store</a>
      <a href="sell.html"><i class="fa-solid fa-tag"></i> Sell</a>
      <a href="wallet.html"><i class="fa-solid fa-wallet"></i> Wallet</a>
      <a href="profile.html" class="active"><i class="fa-solid fa-user"></i> Profile</a>
    </nav>
    <div class="aw-navbar-search">
      <input type="text" id="aw-global-search" placeholder="Search websites…" autocomplete="off"/>
    </div>
    <div class="aw-navbar-right">
      <button class="aw-icon-btn" id="aw-theme-btn"><i class="fa-solid fa-sun" id="aw-theme-icon"></i></button>
      <select id="aw-lang" class="aw-lang-select">
        <option value="en">EN</option>
        <option value="uz">UZ</option>
      </select>
      <a class="aw-user-chip" href="profile.html" id="aw-user-chip" style="display:none">
        <span class="aw-avatar" id="aw-avatar">?</span>
        <span class="aw-user-name" id="aw-user-name">User</span>
        <span class="aw-balance-mini" id="aw-balance">0 AWC</span>
      </a>
      <button class="aw-icon-btn" id="aw-logout-btn" style="display:none">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </div>
</header>

<main class="aw-page">
  <div class="aw-profile-head">
    <div class="aw-avatar aw-avatar-lg" id="p-avatar">?</div>
    <div>
      <h1 id="p-nick">…</h1>
      <div class="aw-muted">
        ID: <code id="p-id"></code> • ⭐ <span id="p-rating">0.0</span> • <span id="p-verified"></span>
      </div>
      <div class="aw-muted">AWC: <strong id="p-balance">0</strong></div>
    </div>
  </div>

  <div class="aw-tabs">
    <button class="aw-tab active" data-tab="dashboard">Dashboard</button>
    <button class="aw-tab" data-tab="orders">Orders</button>
    <button class="aw-tab" data-tab="transactions">Transactions</button>
    <button class="aw-tab" data-tab="messages">Messages</button>
    <button class="aw-tab" data-tab="support">Support</button>
    <button class="aw-tab" data-tab="faq">FAQ</button>
    <button class="aw-tab" data-tab="terms">Terms & Privacy</button>
    <button class="aw-tab" data-tab="settings">Settings</button>
  </div>

  <div id="tab-content" class="aw-tab-content"></div>
</main>

<nav class="aw-tabbar">
  <a href="main.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
  <a href="store.html"><i class="fa-solid fa-store"></i><span>Store</span></a>
  <a href="sell.html" class="aw-tabbar-center"><i class="fa-solid fa-plus"></i><span>Sell</span></a>
  <a href="wallet.html"><i class="fa-solid fa-wallet"></i><span>Wallet</span></a>
  <a href="profile.html" class="active"><i class="fa-solid fa-user"></i><span>Profile</span></a>
</nav>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../components/modals.js"></script>

<script>
(function () {
  'use strict';

  var themeBtn = document.getElementById('aw-theme-btn');
  var themeIcon = document.getElementById('aw-theme-icon');
  if (themeBtn && themeIcon) {
    var t = localStorage.getItem('aw_theme') || 'dark';
    themeIcon.className = 'fa-solid ' + (t === 'light' ? 'fa-moon' : 'fa-sun');
    themeBtn.addEventListener('click', function () {
      var next = (localStorage.getItem('aw_theme') || 'dark') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('aw_theme', next);
      document.documentElement.classList.toggle('dark', next === 'dark');
      document.documentElement.classList.toggle('light', next === 'light');
      themeIcon.className = 'fa-solid ' + (next === 'light' ? 'fa-moon' : 'fa-sun');
    });
  }

  (async function () {
    await loadRates();
    await Auth.load();
    if (!Auth.isLoggedIn()) {
      location.href = 'login.html?next=' + encodeURIComponent('profile.html');
      return;
    }

    var user = Auth.user;
    document.getElementById('p-avatar').textContent = (user.nickname || '?')[0].toUpperCase();
    document.getElementById('p-nick').textContent = user.nickname;
    document.getElementById('p-id').textContent = user.id;
    document.getElementById('p-rating').textContent = (user.rating || 0).toFixed(1);
    document.getElementById('p-verified').textContent = user.verified ? 'Verified ✔' : 'Not verified';
    document.getElementById('p-balance').textContent = fmtAWC(user.balanceAWC);

    var chip = document.getElementById('aw-user-chip');
    if (chip) {
      chip.style.display = 'flex';
      document.getElementById('aw-avatar').textContent = (user.nickname || '?')[0].toUpperCase();
      document.getElementById('aw-user-name').textContent = user.nickname || '';
      document.getElementById('aw-balance').textContent = fmtAWC(user.balanceAWC);
    }
    var lb = document.getElementById('aw-logout-btn');
    if (lb) {
      lb.style.display = 'inline-flex';
      lb.onclick = function () { Auth.logout(); };
    }

    var content = document.getElementById('tab-content');

    function renderTab(name) {
      Array.prototype.forEach.call(document.querySelectorAll('.aw-tab'), function (b) {
        b.classList.toggle('active', b.dataset.tab === name);
      });

      if (name === 'dashboard') return renderDashboard();
      if (name === 'orders') return renderOrders();
      if (name === 'transactions') return renderTransactions();
      if (name === 'messages') return renderMessages();
      if (name === 'support') return renderSupport();
      if (name === 'faq') return renderFaq();
      if (name === 'terms') return renderTerms();
      if (name === 'settings') return renderSettings();
    }

    function renderDashboard() {
      content.innerHTML = '<div class="aw-grid aw-grid-2">' +
        '<div class="aw-card-static"><h3>Total spent</h3><div class="aw-big">' + fmtUZS(user.totalSpent || 0) + '</div></div>' +
        '<div class="aw-card-static"><h3>Total earned</h3><div class="aw-big">' + fmtUZS(user.totalEarned || 0) + '</div></div>' +
        '</div>' +
        '<div class="aw-section"><h3>My websites</h3><div id="dash-sites" class="aw-grid"><div class="aw-loading">…</div></div></div>';
      API.myWebsites().then(function (r) {
        var el = document.getElementById('dash-sites');
        if (!r.success || !r.data.items.length) {
          el.innerHTML = '<div class="aw-empty">No listings yet.</div>'; return;
        }
        el.innerHTML = r.data.items.map(function (w) {
          return '<div class="aw-card-static">' +
            '<div><strong>' + esc(w.name) + '</strong></div>' +
            '<div class="aw-muted">' + esc(w.domain) + '</div>' +
            '<div>' + fmtAWC(w.priceAWC) + ' — <span class="aw-status aw-status-' + esc(w.status) + '">' + esc(w.status) + '</span></div>' +
            '<div><a class="aw-link" href="website-detail.html?id=' + esc(w.webId) + '">Open →</a></div>' +
            '</div>';
        }).join('');
      });
    }

    async function renderOrders() {
      content.innerHTML = '<div class="aw-loading">Loading…</div>';
      var r = await API.myTransactions();
      var orders = (r.success ? r.data.items : []).filter(function (t) { return t.type.indexOf('order') === 0; });
      content.innerHTML = '<div class="aw-table-wrap"><table class="aw-table">' +
        '<thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead>' +
        '<tbody>' + (orders.length ? orders.map(function (t) {
          return '<tr><td>' + fmtDate(t.createdAt) + '</td><td>' + esc(t.type) + '</td><td>' + fmtUZS(t.amountUZS) + '</td><td>' + esc(t.status) + '</td></tr>';
        }).join('') : '<tr><td colspan="4" class="aw-muted">No orders.</td></tr>') + '</tbody>' +
        '</table></div>';
    }

    async function renderTransactions() {
      content.innerHTML = '<div class="aw-loading">Loading…</div>';
      var r = await API.myTransactions();
      if (!r.success) { content.innerHTML = '<div class="aw-empty">Failed.</div>'; return; }
      content.innerHTML = '<div class="aw-table-wrap"><table class="aw-table">' +
        '<thead><tr><th>Date</th><th>Type</th><th>AWC</th><th>UZS</th><th>Status</th></tr></thead>' +
        '<tbody>' + (r.data.items.length ? r.data.items.map(function (t) {
          return '<tr>' +
            '<td>' + fmtDate(t.createdAt) + '</td>' +
            '<td>' + esc(t.type) + '</td>' +
            '<td>' + (t.amountAWC ? fmtAWC(t.amountAWC) : '—') + '</td>' +
            '<td>' + (t.amountUZS ? fmtUZS(t.amountUZS) : '—') + '</td>' +
            '<td><span class="aw-status aw-status-' + esc(t.status) + '">' + esc(t.status) + '</span></td>' +
            '</tr>';
        }).join('') : '<tr><td colspan="5" class="aw-muted">No transactions.</td></tr>') + '</tbody>' +
        '</table></div>';
    }

    function renderMessages() {
      content.innerHTML = '<div class="aw-empty">Direct messaging coming soon.</div>';
    }

    function renderSupport() {
      content.innerHTML = '<form class="aw-form aw-form-narrow" id="support-form">' +
        '<label><span>Message to support</span><textarea id="sup-msg" rows="5" required></textarea></label>' +
        '<button class="aw-btn aw-btn-primary" type="submit">Send</button>' +
        '</form>';
      document.getElementById('support-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var msg = document.getElementById('sup-msg').value.trim();
        if (!msg) return;
        toast('Message queued for admin review.', 'success');
        document.getElementById('sup-msg').value = '';
      });
    }

    function renderFaq() {
      content.innerHTML =
        '<details><summary>How does Safe (escrow) work?</summary><p>Admin holds funds until you confirm delivery.</p></details>' +
        '<details><summary>How do I top up AWC?</summary><p>Wallet → Top up. Admin verifies manual payment.</p></details>' +
        '<details><summary>How many Premium plans?</summary><p>Four: Plus, Prime, Pro, Enterprise.</p></details>';
    }

    function renderTerms() {
      content.innerHTML = '<p class="aw-muted">By using AWebShop you agree to platform rules.</p>';
    }

    function renderSettings() {
      content.innerHTML = '<form class="aw-form aw-form-narrow" id="settings-form">' +
        '<label><span>Nickname (changeable once per 2 weeks)</span><input id="st-nick" value="' + esc(user.nickname) + '"/></label>' +
        '<label><span>Language</span>' +
        '<select id="st-lang">' +
        '<option value="en"' + (user.language === 'en' ? ' selected' : '') + '>English</option>' +
        '<option value="uz"' + (user.language === 'uz' ? ' selected' : '') + '>O\'zbekcha</option>' +
        '</select></label>' +
        '<label><span>Currency</span>' +
        '<select id="st-cur">' +
        '<option value="UZS"' + (user.currency === 'UZS' ? ' selected' : '') + '>UZS</option>' +
        '<option value="USD"' + (user.currency === 'USD' ? ' selected' : '') + '>USD</option>' +
        '</select></label>' +
        '<label class="aw-checkbox"><input type="checkbox" id="st-dark"' + (user.darkMode ? ' checked' : '') + '/><span>Dark mode</span></label>' +
        '<div class="aw-form-error" id="st-err" hidden></div>' +
        '<button class="aw-btn aw-btn-primary" type="submit">Save</button>' +
        '</form>';

      document.getElementById('settings-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        var payload = {
          nickname: document.getElementById('st-nick').value.trim(),
          language: document.getElementById('st-lang').value,
          currency: document.getElementById('st-cur').value,
          darkMode: document.getElementById('st-dark').checked
        };
        var r = await API.updateProfile(payload);
        if (r.success) {
          Auth.user = r.data.user;
          localStorage.setItem('aw_theme', payload.darkMode ? 'dark' : 'light');
          localStorage.setItem('aw_lang', payload.language);
          toast('Saved.', 'success');
          setTimeout(function () { location.reload(); }, 500);
        } else {
          var e2 = document.getElementById('st-err');
          e2.textContent = r.message; e2.hidden = false;
        }
      });
    }

    Array.prototype.forEach.call(document.querySelectorAll('.aw-tab'), function (b) {
      b.addEventListener('click', function () { renderTab(b.dataset.tab); });
    });

    var hash = location.hash.replace('#', '') || 'dashboard';
    renderTab(hash);
  })();
})();
</script>
</body>
</html>
