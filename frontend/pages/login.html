<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Login — AWebShop<title><link rel="icon" type="image/png" href="/frontend/assets/image/logo.png">
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="aw-body">
<div id="aw-header"></div>

<main class="aw-page aw-auth-page">
  <div class="aw-auth-card">
    <h1>Welcome back</h1>
    <p class="aw-muted">Login with your nickname and password.</p>

    <form id="login-form" class="aw-form" autocomplete="on">
      <label>
        <span>Nickname</span>
        <input type="text" id="nickname" name="nickname" autocomplete="username" required/>
      </label>
      <label>
        <span>Password</span>
        <input type="password" id="password" name="password" autocomplete="current-password" required/>
      </label>
      <div class="aw-form-error" id="form-error" hidden></div>
      <button type="submit" class="aw-btn aw-btn-primary aw-btn-block">Login</button>
    </form>

    <div class="aw-auth-links">
      <a href="#" id="forgot-link">Recover account</a>
      <a href="register.html">Create account</a>
    </div>
  </div>
</main>

<div id="aw-footer"></div>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/validation.js"></script>
<script src="../components/header.js"></script>
<script src="../components/footer.js"></script>
<script src="../components/modals.js"></script>

<script>
(async () => {
  await loadRates();

  const form = document.getElementById('login-form');
  const errBox = document.getElementById('form-error');

  function showErr(msg) {
    errBox.textContent = msg;
    errBox.hidden = false;
  }

  // Allaqachon tizimga kirgan bo'lsa
  await Auth.load();
  if (Auth.isLoggedIn()) {
    location.href = new URLSearchParams(location.search).get('next') || 'main.html';
    return;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.hidden = true;

    const nickname = form.nickname.value.trim();
    const password = form.password.value;

    if (!Validators.nickname(nickname)) return showErr('Invalid nickname format.');
    if (!Validators.password(password)) return showErr('Password must be at least 8 characters.');

    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Logging in…';

    const res = await Auth.login(nickname, password);
    if (res.success) {
      toast('Welcome, ' + res.data.user.nickname + '!', 'success');
      const next = new URLSearchParams(location.search).get('next') || 'main.html';
      setTimeout(() => location.href = next, 400);
    } else {
      showErr(res.message || 'Login failed.');
      btn.disabled = false; btn.textContent = 'Login';
    }
  });

  document.getElementById('forgot-link').addEventListener('click', async (e) => {
    e.preventDefault();
    openModal({
      title: 'Recover Account',
      body: `
        <div class="aw-form">
          <label><span>Nickname</span><input type="text" id="rc-nick"/></label>
          <div id="rc-step1">
            <button type="button" class="aw-btn aw-btn-primary aw-btn-block" id="rc-send">Send recovery code</button>
          </div>
          <div id="rc-step2" hidden>
            <label><span>Recovery code (6 digits)</span><input type="text" id="rc-code"/></label>
            <label><span>New password</span><input type="password" id="rc-pass"/></label>
            <button type="button" class="aw-btn aw-btn-primary aw-btn-block" id="rc-reset">Reset password</button>
          </div>
          <div class="aw-form-error" id="rc-err" hidden></div>
        </div>
      `,
      actions: [{ label: 'Close', className: 'aw-btn-ghost', onClick: () => closeModal() }]
    });

    const err = document.getElementById('rc-err');
    const show = m => { err.textContent = m; err.hidden = false; };

    document.getElementById('rc-send').addEventListener('click', async () => {
      const nickname = document.getElementById('rc-nick').value.trim();
      if (!nickname) return show('Enter your nickname.');
      const res = await API.forgotPassword({ nickname });
      if (res.success) {
        toast('If the account exists, a code was sent via Telegram.', 'info');
        if (res.data.debugCode) toast('DEV code: ' + res.data.debugCode, 'warn', 8000);
        document.getElementById('rc-step2').hidden = false;
      } else show(res.message);
    });

    document.getElementById('rc-reset').addEventListener('click', async () => {
      const nickname = document.getElementById('rc-nick').value.trim();
      const code = document.getElementById('rc-code').value.trim();
      const newPassword = document.getElementById('rc-pass').value;
      if (!Validators.code(code)) return show('Code must be 6 digits.');
      if (!Validators.password(newPassword)) return show('Password must be at least 8 characters.');
      const res = await API.resetPassword({ nickname, code, newPassword });
      if (res.success) {
        toast('Password updated. You can login now.', 'success');
        closeModal();
      } else show(res.message);
    });
  });
})();
</script>
</body>
</html>
