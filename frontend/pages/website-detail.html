<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Website — AWebShop</title>

<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="aw-body">

<header class="aw-navbar">
  <div class="aw-navbar-inner">
    <a class="aw-navbar-brand" href="main.html">
      <img src="../assets/image/logo.png" alt="AWebShop" onerror="this.style.display='none'"/>
      <span>AWebShop</span>
    </a>
    <nav class="aw-navbar-links">
      <a href="main.html"><i class="fa-solid fa-house"></i> Home</a>
      <a href="store.html"><i class="fa-solid fa-store"></i> Store</a>
      <a href="sell.html"><i class="fa-solid fa-tag"></i> Sell</a>
      <a href="wallet.html"><i class="fa-solid fa-wallet"></i> Wallet</a>
      <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
    </nav>
    <div class="aw-navbar-search">
      <input type="text" id="aw-global-search" placeholder="Search websites…" autocomplete="off"/>
    </div>
    <div class="aw-navbar-right">
      <button class="aw-icon-btn" id="aw-theme-btn"><i class="fa-solid fa-sun" id="aw-theme-icon"></i></button>
      <select id="aw-lang" class="aw-lang-select">
        <option value="en">EN</option>
        <option value="uz">UZ</option>
      </select>
      <a class="aw-btn aw-btn-ghost" href="login.html" id="aw-login-btn">Login</a>
      <a class="aw-btn aw-btn-primary" href="register.html" id="aw-register-btn">Register</a>
      <a class="aw-user-chip" href="profile.html" id="aw-user-chip" style="display:none">
        <span class="aw-avatar" id="aw-avatar">?</span>
        <span class="aw-user-name" id="aw-user-name">User</span>
        <span class="aw-balance-mini" id="aw-balance">0 AWC</span>
      </a>
      <button class="aw-icon-btn" id="aw-logout-btn" style="display:none">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </div>
</header>

<main class="aw-page">
  <div id="detail-root">
    <div class="aw-loading">Loading…</div>
  </div>
</main>

<nav class="aw-tabbar">
  <a href="main.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
  <a href="store.html"><i class="fa-solid fa-store"></i><span>Store</span></a>
  <a href="sell.html" class="aw-tabbar-center"><i class="fa-solid fa-plus"></i><span>Sell</span></a>
  <a href="wallet.html"><i class="fa-solid fa-wallet"></i><span>Wallet</span></a>
  <a href="profile.html"><i class="fa-solid fa-user"></i><span>Profile</span></a>
</nav>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../components/modals.js"></script>

<script>
(function () {
  'use strict';

  var themeBtn = document.getElementById('aw-theme-btn');
  var themeIcon = document.getElementById('aw-theme-icon');
  if (themeBtn && themeIcon) {
    var t = localStorage.getItem('aw_theme') || 'dark';
    themeIcon.className = 'fa-solid ' + (t === 'light' ? 'fa-moon' : 'fa-sun');
    themeBtn.addEventListener('click', function () {
      var next = (localStorage.getItem('aw_theme') || 'dark') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('aw_theme', next);
      document.documentElement.classList.toggle('dark', next === 'dark');
      document.documentElement.classList.toggle('light', next === 'light');
      themeIcon.className = 'fa-solid ' + (next === 'light' ? 'fa-moon' : 'fa-sun');
    });
  }
  var searchInput = document.getElementById('aw-global-search');
  if (searchInput) searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var q = searchInput.value.trim();
      if (q) location.href = '/search/' + encodeURIComponent(q);
    }
  });

  (async function () {
    await loadRates();
    await Auth.load();
    updateAuthUI();

    var webId = new URLSearchParams(location.search).get('id');
    var root = document.getElementById('detail-root');

    if (!webId) {
      root.innerHTML = '<div class="aw-empty">Missing website id.</div>';
      return;
    }

    var res = await API.websiteDetail(webId);
    if (!res.success) {
      root.innerHTML = '<div class="aw-empty">' + esc(res.message || 'Not found') + '</div>';
      return;
    }
    var w = res.data.website;
    var seller = res.data.seller;

    var typeLabel = w.type === 'frontend' ? '🎨 Frontend'
      : w.type === 'backend' ? '⚙️ Backend'
      : w.type === 'fullstack' ? '🚀 Fullstack' : '';

    root.innerHTML = '<div class="aw-detail-grid">' +
      '<div class="aw-detail-img">' +
      (w.imageUrl ? '<img src="' + esc(w.imageUrl) + '" alt="" onerror="this.style.display=\'none\'"/>' : '<div class="aw-card-noimg">' + esc((w.name || '?')[0]) + '</div>') +
      '</div>' +
      '<div class="aw-detail-info">' +
      '<div class="aw-detail-top">' +
      '<h1>' + esc(w.name) + '</h1>' +
      (w.saleType === 'safe' ? '<span class="aw-badge aw-badge-safe">Safe (escrow)</span>' : '<span class="aw-badge aw-badge-fast">Fast (direct)</span>') +
      '</div>' +
      '<div class="aw-detail-domain">' + esc(w.domain) + '</div>' +
      '<div class="aw-detail-topic">' + esc(w.topic) + ' • ' + typeLabel + '</div>' +
      '<div class="aw-detail-price">' +
      '<strong>' + fmtAWC(w.priceAWC) + '</strong>' +
      '<small>' + fmtUZS(w.priceUZS) + ' • ' + fmtUSD(w.priceUSD) + '</small>' +
      '</div>' +
      '<p class="aw-detail-desc">' + esc(w.description) + '</p>' +
      '<div class="aw-detail-meta">' +
      '<div>👁 ' + (w.views || 0) + '</div>' +
      '<div>⭐ ' + (w.rating || 0).toFixed(1) + '</div>' +
      '<div>Web ID: <code>' + esc(w.webId) + '</code></div>' +
      '</div>' +
      '<div class="aw-sale-note ' + (w.saleType === 'safe' ? 'safe' : 'fast') + '">' +
      (w.saleType === 'safe' ? 'Escrow-protected. Admin holds funds until you confirm.' : 'Direct seller-to-buyer. Fewer protections.') +
      '</div>' +
      '<div class="aw-detail-actions">' +
      '<button class="aw-btn aw-btn-primary" id="buy-btn">Buy Now</button>' +
      '<a class="aw-btn aw-btn-ghost" href="store.html">Back to store</a>' +
      '</div>' +
      (seller ? '<div class="aw-seller">' +
        '<h4>Seller</h4>' +
        '<div class="aw-seller-row">' +
        '<span class="aw-avatar">' + esc((seller.nickname || '?')[0].toUpperCase()) + '</span>' +
        '<div><div><strong>' + esc(seller.nickname) + '</strong> ' + (seller.verified ? '✔' : '') + '</div>' +
        '<div class="aw-muted">⭐ ' + (seller.rating || 0).toFixed(1) + '</div></div>' +
        '</div></div>' : '') +
      '</div></div>';

    document.getElementById('buy-btn').addEventListener('click', async function () {
      if (!Auth.isLoggedIn()) {
        location.href = 'login.html?next=' + encodeURIComponent('website-detail.html?id=' + webId);
        return;
      }
      var ok = await confirmModal('Confirm purchase', 'Buy "' + w.name + '" for ' + fmtAWC(w.priceAWC) + '?');
      if (!ok) return;

      var buyRes = await API.buyWebsite(webId, {});
      if (buyRes.success) {
        toast('Order created: ' + buyRes.data.order.id, 'success', 5000);
        setTimeout(function () { location.href = 'wallet.html'; }, 1200);
      } else {
        toast(buyRes.message || 'Purchase failed', 'error', 5000);
      }
    });

    function updateAuthUI() {
      var user = (window.Auth && window.Auth.user) || null;
      if (user) {
        var lg = document.getElementById('aw-login-btn');
        var rg = document.getElementById('aw-register-btn');
        var uc = document.getElementById('aw-user-chip');
        var lb = document.getElementById('aw-logout-btn');
        if (lg) lg.style.display = 'none';
        if (rg) rg.style.display = 'none';
        if (uc) {
          uc.style.display = 'flex';
          document.getElementById('aw-avatar').textContent = (user.nickname || '?')[0].toUpperCase();
          document.getElementById('aw-user-name').textContent = user.nickname || '';
          document.getElementById('aw-balance').textContent = fmtAWC(user.balanceAWC);
        }
        if (lb) {
          lb.style.display = 'inline-flex';
          lb.onclick = function () { Auth.logout(); };
        }
      }
    }
  })();
})();
</script>
</body>
</html>
