<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Store — AWebShop</title>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="aw-body">
<div id="aw-header"></div>

<main class="aw-page">
  <div class="aw-section-head">
    <h1>Store</h1>
    <div class="aw-muted" id="count-label"></div>
  </div>

  <div class="aw-filters">
    <input id="aw-search-input" type="text" placeholder="Search by name, domain, description"/>
    <select id="f-topic">
      <option value="">All topics</option>
      <option>AI</option>
      <option>Online Shop</option>
      <option>3D Game</option>
      <option>Other</option>
    </select>
    <select id="f-sale">
      <option value="">All types</option>
      <option value="safe">Safe (escrow)</option>
      <option value="fast">Fast (direct)</option>
    </select>
    <select id="f-sort">
      <option value="newest">Newest</option>
      <option value="price_asc">Price ↑</option>
      <option value="price_desc">Price ↓</option>
      <option value="popular">Popular</option>
    </select>
    <button class="aw-btn aw-btn-ghost" id="f-reset">Reset</button>
  </div>

  <div class="aw-grid" id="store-grid">
    <div class="aw-loading">Loading…</div>
  </div>

  <div class="aw-pagination" id="pager"></div>
</main>

<div id="aw-footer"></div>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../components/header.js"></script>
<script src="../components/footer.js"></script>
<script src="../components/website-card.js"></script>
<script src="../components/pagination.js"></script>
<script src="../js/shortcuts.js"></script>

<script>
(async () => {
  await loadRates();

  const state = {
    page: 1,
    perPage: 30,
    search: '',
    topic: '',
    saleType: '',
    sort: 'newest'
  };

  const grid = document.getElementById('store-grid');
  const pager = document.getElementById('pager');
  const countLabel = document.getElementById('count-label');

  async function load() {
    showLoading(grid);
    const res = await API.listWebsites(state);
    if (!res.success) {
      grid.innerHTML = '<div class="aw-empty">Failed to load.</div>';
      return;
    }
    const { items, total, page, totalPages } = res.data;
    countLabel.textContent = `${total} websites`;

    if (!items.length) {
      grid.innerHTML = '<div class="aw-empty">' + t('noResults') + '</div>';
    } else {
      grid.innerHTML = items.map(websiteCard).join('');
    }
    renderPagination(pager, { page, totalPages, onChange: p => { state.page = p; load(); window.scrollTo({top:0,behavior:'smooth'}); } });
  }

  // URL dan boshlang'ich qiymatlarni o'qish
  const usp = new URLSearchParams(location.search);
  if (usp.get('search')) state.search = usp.get('search');
  if (usp.get('topic')) state.topic = usp.get('topic');
  if (usp.get('saleType')) state.saleType = usp.get('saleType');
  if (usp.get('sort')) state.sort = usp.get('sort');

  // UI sinxronlash
  document.getElementById('aw-search-input').value = state.search;
  document.getElementById('f-topic').value = state.topic;
  document.getElementById('f-sale').value = state.saleType;
  document.getElementById('f-sort').value = state.sort;

  document.getElementById('aw-search-input').addEventListener('input', e => {
    state.search = e.target.value.trim();
    state.page = 1;
    clearTimeout(window.__sT);
    window.__sT = setTimeout(load, 350);
  });
  document.getElementById('f-topic').addEventListener('change', e => { state.topic = e.target.value; state.page = 1; load(); });
  document.getElementById('f-sale').addEventListener('change', e => { state.saleType = e.target.value; state.page = 1; load(); });
  document.getElementById('f-sort').addEventListener('change', e => { state.sort = e.target.value; state.page = 1; load(); });
  document.getElementById('f-reset').addEventListener('click', () => {
    state.page = 1; state.search = ''; state.topic = ''; state.saleType = ''; state.sort = 'newest';
    document.getElementById('aw-search-input').value = '';
    document.getElementById('f-topic').value = '';
    document.getElementById('f-sale').value = '';
    document.getElementById('f-sort').value = 'newest';
    load();
  });

  load();
})();
</script>
</body>
</html>
