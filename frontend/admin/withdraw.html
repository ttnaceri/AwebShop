<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Withdrawals — Admin</title>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-tabs" id="wd-tabs">
      <button class="active" data-f="pending">Pending</button>
      <button data-f="approved">Approved</button>
      <button data-f="rejected">Rejected</button>
      <button data-f="">All</button>
    </div>
    <div class="admin-toolbar">
      <button class="aw-btn aw-btn-ghost" id="wd-refresh">Refresh</button>
    </div>
    <div id="wd-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>
<script src="../components/admin-console.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Withdrawals', 'Approve or reject AWC withdrawals');

  let all = [];
  let filter = 'pending';
  const host = document.getElementById('wd-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const r = await API.adminWithdrawals();
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed.</div>'; return; }
    all = r.data.items;
    render();
  }

  function render() {
    const list = filter ? all.filter(w => w.status === filter) : all;

    renderTable(host,
      [
        { label: 'ID', render: r => `<code>${esc(r.id)}</code>` },
        { label: 'User', render: r => esc(r.userId) },
        { label: 'AWC', render: r => fmtAWC(r.amountAWC) },
        { label: 'UZS', render: r => fmtMoney(r.amountUZS) },
        { label: 'Card', render: r => esc(r.cardNumber || '—') },
        { label: 'Status', render: r => statusPill(r.status) },
        { label: 'Created', render: r => fmtDateShort(r.createdAt) },
        { label: 'Actions', render: r => r.status === 'pending' ? `
          <div class="admin-actions">
            <button class="admin-btn-sm ok" data-id="${esc(r.id)}" data-act="approve">Approve</button>
            <button class="admin-btn-sm bad" data-id="${esc(r.id)}" data-act="reject">Reject</button>
          </div>
        ` : '—' }
      ],
      list,
      { emptyText: 'No withdrawals in this filter.' }
    );

    host.querySelectorAll('button[data-act]').forEach(b => {
      b.addEventListener('click', () => decide(b.dataset.id, b.dataset.act));
    });
  }

  async function decide(id, act) {
    const ok = await confirmModal(
      act === 'approve' ? 'Approve withdrawal?' : 'Reject withdrawal?',
      'This will notify the user via Telegram (if configured).'
    );
    if (!ok) return;
    const r = await API.adminWithdrawDecision(id, act);
    if (r.success) { toast('Done.', 'success'); load(); }
    else toast(r.message, 'error');
  }

  document.querySelectorAll('#wd-tabs button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#wd-tabs button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      filter = b.dataset.f;
      render();
    });
  });

  document.getElementById('wd-refresh').addEventListener('click', load);

  load();
})();
</script>
</body>
</html>
