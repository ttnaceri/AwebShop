<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Badges — Admin</title>
<link rel="icon" type="image/png" href="/frontend/assets/image/logo.png">
<link rel="stylesheet" href="../css/main.css"/><link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/><link rel="stylesheet" href="../css/responsive.css"/></head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content"><p id="admin-subtitle" class="admin-sub"></p></div>
</div>
<script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script>
<script src="../js/admin.js"></script><script src="../components/modals.js"></script><script src="../components/admin-console.js"></script>
<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  buildCrudPage({
    title: 'Badges',
    subtitle: 'Badge manager',
    endpoint: 'badges',
    idField: 'id',
    columns: [
      { label: 'Name', render: r => esc(r.name) },
      { label: 'Color', render: r => `<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${esc(r.color||'#7b5cff')};vertical-align:middle"></span> ${esc(r.color||'')}` },
      { label: 'Image', render: r => r.image ? `<img src="/${esc(r.image)}" style="width:24px;height:24px" onerror="this.style.display='none'"/>` : '—' },
      { label: 'Enabled', render: r => r.enabled ? statusPill('active') : statusPill('cancelled') }
    ],
    formFields: [
      { key: 'name', label: 'Name', type: 'text' },
      { key: 'image', label: 'Image path (e.g. frontend/assets/image/galochka.png)', type: 'text' },
      { key: 'color', label: 'Color (hex)', type: 'text', default: '#7b5cff' },
      { key: 'enabled', label: 'Enabled', type: 'checkbox', default: true }
    ]
  });
})();
</script>
</body></html>
