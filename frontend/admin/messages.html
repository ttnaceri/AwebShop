<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Messages — Admin</title>
<link rel="stylesheet" href="../css/main.css"/><link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/><link rel="stylesheet" href="../css/responsive.css"/></head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content"><p id="admin-subtitle" class="admin-sub"></p></div>
</div>
<script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script>
<script src="../js/admin.js"></script><script src="../components/modals.js"></script><script src="../components/admin-console.js"></script>
<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Contact Messages', 'Messages from users and bot');

  const content = document.querySelector('.admin-content');
  content.insertAdjacentHTML('beforeend', `
    <div class="admin-toolbar"><button class="aw-btn aw-btn-ghost" id="msg-refresh">Refresh</button></div>
    <div id="msg-host"></div>
  `);
  async function load() {
    const r = await API.adminGet('messages');
    if (!r.success) return;
    renderTable(document.getElementById('msg-host'),
      [
        { label: 'From', render: x => esc(x.nickname || x.telegramId || x.userId || '—') },
        { label: 'Source', render: x => esc(x.source || 'web') },
        { label: 'Body', render: x => esc((x.body || '').slice(0, 100)) },
        { label: 'Status', render: x => statusPill(x.status === 'unread' ? 'pending' : 'active') },
        { label: 'Created', render: x => fmtDateShort(x.createdAt) },
        { label: 'Actions', render: x => `
          <div class="admin-actions">
            <button class="admin-btn-sm ok" data-act="read" data-id="${esc(x.id)}">Mark read</button>
            <button class="admin-btn-sm bad" data-act="del" data-id="${esc(x.id)}">Delete</button>
          </div>
        ` }
      ], r.data.items, { emptyText: 'No messages.' }
    );
    document.querySelectorAll('#msg-host button').forEach(b => {
      b.addEventListener('click', async () => {
        if (b.dataset.act === 'read') await API.adminPut('messages', { id: b.dataset.id, status: 'read' });
        else await API.adminDelete('messages', { id: b.dataset.id });
        load();
      });
    });
  }
  document.getElementById('msg-refresh').addEventListener('click', load);
  load();
})();
</script>
</body></html>
