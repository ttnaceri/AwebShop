<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Messages — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-toolbar">
      <button class="aw-btn aw-btn-ghost" id="m-refresh">Refresh</button>
    </div>
    <div id="msg-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Messages', 'Contact messages from users');

  const host = document.getElementById('msg-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const r = await API.adminGet('messages');
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed: ' + esc(r.message || '') + '</div>'; return; }
    render(r.data.items || []);
  }

  function render(items) {
    renderTable(host,
      [
        { label: 'From', render: x => esc(x.nickname || x.telegramId || x.userId || '—') },
        { label: 'Source', render: x => esc(x.source || 'web') },
        { label: 'Body', render: x => esc((x.body || '').slice(0, 100)) },
        { label: 'Status', render: x => statusPill(x.status === 'unread' ? 'pending' : 'active') },
        { label: 'Created', render: x => fmtDateShort(x.createdAt) },
        { label: 'Actions', render: x => '<div class="admin-actions">' +
          '<button class="admin-btn-sm ok" data-read="' + esc(x.id) + '">Read</button>' +
          '<button class="admin-btn-sm bad" data-del="' + esc(x.id) + '">Delete</button>' +
          '</div>' }
      ],
      items,
      { emptyText: 'No messages yet.' }
    );
    host.querySelectorAll('button[data-read]').forEach(b => {
      b.addEventListener('click', async () => {
        await API.adminPut('messages', { id: b.dataset.read, status: 'read' });
        load();
      });
    });
    host.querySelectorAll('button[data-del]').forEach(b => {
      b.addEventListener('click', async () => {
        if (!(await confirmModal('Delete message?', 'Proceed?'))) return;
        await API.adminDelete('messages', { id: b.dataset.del });
        load();
      });
    });
  }

  document.getElementById('m-refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
