<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Payments — Admin</title>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>

    <div class="admin-legend-note">
      Manual card payments. Future providers (Payme, Hamkorbank) are disabled by default.
    </div>

    <div class="admin-toolbar">
      <input id="p-search" placeholder="Search by transaction ID, user ID, reference…"/>
      <select id="p-filter">
        <option value="pending_manual_verification">Pending verification</option>
        <option value="completed">Completed</option>
        <option value="rejected">Rejected</option>
        <option value="">All</option>
      </select>
      <button class="aw-btn aw-btn-ghost" id="p-refresh">Refresh</button>
    </div>

    <div id="pay-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>
<script src="../components/admin-console.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Payments', 'Manual card payment verification queue');

  let all = [];
  const host = document.getElementById('pay-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    // Backendda /api/admin/transactions yo'q — adminUsers -> user transactions orqali yig'amiz.
    // Bu yerda biz myTransactions ni admin sifatida ishlatmaymiz; backend admin endpointlaridan olamiz.
    // Hozircha faqat escrow va withdraw to'liq. Payment verification uchun endpoint mavjud: /api/admin/payments/verify.
    // Foydalanuvchilar ro'yxatidan transactionlarni yig'amiz.
    const r = await API.adminUsers();
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed.</div>'; return; }

    // Har bir user uchun transaction — hozircha token history ishlatib yig'amiz (faqat o'zimiz uchun).
    // Bu UI ni ishlashi uchun mock: admin backendga transactions/admin endpoint qo'shilishi mumkin.
    // Hozircha joriy yuklash bo'sh bo'lsa ham ishlaydi.
    const myTx = await API.tokenHistory();
    all = (myTx.success ? myTx.data.items : []).filter(t => t.type === 'topup_pending' || t.type === 'topup_completed');
    render();
  }

  function render() {
    const q = document.getElementById('p-search').value.trim().toLowerCase();
    const f = document.getElementById('p-filter').value;
    let list = all.slice();
    if (q) list = list.filter(t =>
      (t.id || '').toLowerCase().includes(q) ||
      (t.userId || '').includes(q) ||
      (t.paymentDetailsReference || '').toLowerCase().includes(q)
    );
    if (f) list = list.filter(t => t.status === f);

    renderTable(host,
      [
        { label: 'Tx ID', render: r => `<code>${esc(r.id)}</code>` },
        { label: 'User', render: r => esc(r.userId) },
        { label: 'Amount', render: r => `${fmtMoney(r.amountUZS)}<br><small>${fmtAWC(r.amountAWC)}</small>` },
        { label: 'Reference', render: r => esc(r.paymentDetailsReference || '—') },
        { label: 'Method', render: r => esc(r.paymentMethod || '—') },
        { label: 'Status', render: r => statusPill(r.status) },
        { label: 'Created', render: r => fmtDateShort(r.createdAt) },
        { label: 'Actions', render: r => r.status === 'pending_manual_verification' ? `
          <div class="admin-actions">
            <button class="admin-btn-sm ok" data-id="${esc(r.id)}" data-act="approve">Approve</button>
            <button class="admin-btn-sm bad" data-id="${esc(r.id)}" data-act="reject">Reject</button>
          </div>
        ` : '—' }
      ],
      list,
      { emptyText: 'No payments in this filter.' }
    );

    host.querySelectorAll('button[data-act]').forEach(b => {
      b.addEventListener('click', () => decide(b.dataset.id, b.dataset.act));
    });
  }

  async function decide(id, act) {
    const ok = await confirmModal(
      act === 'approve' ? 'Approve this payment?' : 'Reject this payment?',
      'User AWC balance will be updated accordingly.'
    );
    if (!ok) return;
    const r = await API.adminVerifyPayment(id, act, '');
    if (r.success) { toast('Updated.', 'success'); load(); }
    else toast(r.message, 'error');
  }

  document.getElementById('p-search').addEventListener('input', render);
  document.getElementById('p-filter').addEventListener('change', render);
  document.getElementById('p-refresh').addEventListener('click', load);

  load();
})();
</script>
</body>
</html>
