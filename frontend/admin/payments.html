<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Payments — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-legend-note">
      Manual payments: pending → verified (approve) or rejected.
    </div>
    <div class="admin-toolbar">
      <select id="pay-filter">
        <option value="pending_manual_verification">Pending</option>
        <option value="completed">Completed</option>
        <option value="rejected">Rejected</option>
        <option value="">All</option>
      </select>
      <button class="aw-btn aw-btn-ghost" id="pay-refresh">Refresh</button>
    </div>
    <div id="pay-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Payments', 'Manual card payment verification');

  let all = [];
  const host = document.getElementById('pay-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const r = await API.adminGet('transactions');
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed: ' + esc(r.message || '') + '</div>'; return; }
    all = r.data.items || [];
    render();
  }

  function render() {
    const f = document.getElementById('pay-filter').value;
    const list = f ? all.filter(t => t.status === f) : all;

    renderTable(host,
      [
        { label: 'Tx ID', render: r => '<code>' + esc(r.id) + '</code>' },
        { label: 'User', render: r => esc(r.userId) },
        { label: 'Type', render: r => esc(r.type) },
        { label: 'UZS', render: r => fmtMoney(r.amountUZS) },
        { label: 'AWC', render: r => (r.amountAWC || 0).toFixed(2) },
        { label: 'Reference', render: r => esc(r.paymentDetailsReference || '—') },
        { label: 'Status', render: r => statusPill(r.status) },
        { label: 'Created', render: r => fmtDateShort(r.createdAt) },
        { label: 'Actions', render: r => r.status === 'pending_manual_verification' ? `
          <div class="admin-actions">
            <button class="admin-btn-sm ok" data-act="approve" data-id="${esc(r.id)}">Approve</button>
            <button class="admin-btn-sm bad" data-act="reject" data-id="${esc(r.id)}">Reject</button>
          </div>
        ` : '—' }
      ],
      list,
      { emptyText: 'No payments.' }
    );

    host.querySelectorAll('button[data-act]').forEach(b => {
      b.addEventListener('click', () => decide(b.dataset.id, b.dataset.act));
    });
  }

  async function decide(id, act) {
    if (!(await confirmModal(act === 'approve' ? 'Approve payment?' : 'Reject payment?', 'Proceed?'))) return;
    const r = await API.adminPost('payments/verify', { transactionId: id, decision: act, adminNotes: '' });
    if (r.success) { toast('Done', 'success'); load(); }
    else toast(r.message, 'error');
  }

  document.getElementById('pay-filter').addEventListener('change', render);
  document.getElementById('pay-refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
