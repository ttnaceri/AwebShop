<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Events — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-legend-note">Max 6 events — FIFO (yangi qo'shilsa, eng eskisi o'chiriladi)</div>
    <div class="admin-toolbar">
      <button class="aw-btn aw-btn-primary" id="e-add">+ New event</button>
      <button class="aw-btn aw-btn-ghost" id="e-refresh">Refresh</button>
    </div>
    <div id="events-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Events', 'Rotating homepage events');

  const host = document.getElementById('events-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const r = await API.adminGet('events');
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed: ' + esc(r.message || '') + '</div>'; return; }
    render(r.data.items || []);
  }

  function render(items) {
    renderTable(host,
      [
        { label: 'Title', render: x => esc(x.title) },
        { label: 'Description', render: x => esc((x.description || '').slice(0, 60)) },
        { label: 'Link', render: x => x.link ? '<a href="' + esc(x.link) + '" target="_blank">open</a>' : '—' },
        { label: 'Status', render: x => x.enabled ? statusPill('active') : statusPill('cancelled') },
        { label: 'Created', render: x => fmtDateShort(x.createdAt) },
        { label: 'Actions', render: x => '<div class="admin-actions"><button class="admin-btn-sm bad" data-del="' + esc(x.id) + '">Delete</button></div>' }
      ],
      items,
      { emptyText: 'No events yet.' }
    );
    host.querySelectorAll('button[data-del]').forEach(b => {
      b.addEventListener('click', async () => {
        if (!(await confirmModal('Delete event?', 'Proceed?'))) return;
        const r = await API.adminDelete('events', { id: b.dataset.del });
        if (r.success) { toast('Deleted.', 'success'); load(); }
        else toast(r.message, 'error');
      });
    });
  }

  document.getElementById('e-add').addEventListener('click', () => {
    openModal({
      title: 'New event',
      body: '<div class="aw-form">' +
        '<label><span>Title</span><input id="e-title"/></label>' +
        '<label><span>Description</span><textarea id="e-desc" rows="3"></textarea></label>' +
        '<label><span>Image URL</span><input id="e-img"/></label>' +
        '<label><span>Link URL</span><input id="e-link"/></label>' +
        '<label class="aw-checkbox"><input type="checkbox" id="e-enabled" checked/><span>Enabled</span></label>' +
        '</div>',
      actions: [
        { label: 'Cancel', className: 'aw-btn-ghost', onClick: () => closeModal() },
        { label: 'Create', className: 'aw-btn-primary', onClick: async () => {
          const r = await API.adminPost('events', {
            title: document.getElementById('e-title').value,
            description: document.getElementById('e-desc').value,
            imageUrl: document.getElementById('e-img').value,
            link: document.getElementById('e-link').value,
            enabled: document.getElementById('e-enabled').checked
          });
          if (r.success) { toast('Created.', 'success'); closeModal(); load(); }
          else toast(r.message, 'error');
        }}
      ]
    });
  });
  document.getElementById('e-refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
