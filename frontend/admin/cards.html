<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cards — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-toolbar">
      <button class="aw-btn aw-btn-primary" id="c-add">+ Add card</button>
      <button class="aw-btn aw-btn-ghost" id="c-refresh">Refresh</button>
    </div>
    <div id="cards-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Payment Cards', 'Cards shown to users for manual top-up');

  const host = document.getElementById('cards-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const r = await API.adminGet('cards');
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed: ' + esc(r.message || '') + '</div>'; return; }
    render(r.data.items || []);
  }

  function render(items) {
    renderTable(host,
      [
        { label: 'Card', render: x => '**** ' + esc(String(x.cardNumber || '').slice(-4)) },
        { label: 'Owner', render: x => esc(x.owner) },
        { label: 'Bank', render: x => esc(x.bank) },
        { label: 'Type', render: x => esc(x.type) },
        { label: 'Expiry', render: x => esc(x.expiry) },
        { label: 'Status', render: x => x.status === 'active' ? statusPill('active') : statusPill('cancelled') },
        { label: 'Default', render: x => x.isDefault ? '⭐' : '' },
        { label: 'Actions', render: x => '<div class="admin-actions">' +
          '<button class="admin-btn-sm" data-edit="' + esc(x.id) + '">Edit</button>' +
          '<button class="admin-btn-sm bad" data-del="' + esc(x.id) + '">Delete</button>' +
          '</div>' }
      ],
      items,
      { emptyText: 'No cards yet.' }
    );

    host.querySelectorAll('button[data-del]').forEach(b => {
      b.addEventListener('click', async () => {
        if (!(await confirmModal('Delete card?', 'Proceed?'))) return;
        const r = await API.adminDelete('cards', { id: b.dataset.del });
        if (r.success) { toast('Deleted.', 'success'); load(); }
        else toast(r.message, 'error');
      });
    });

    host.querySelectorAll('button[data-edit]').forEach(b => {
      b.addEventListener('click', () => openCardModal(items.find(x => x.id === b.dataset.edit)));
    });
  }

  function openCardModal(card) {
    const isEdit = !!card;
    openModal({
      title: isEdit ? 'Edit card' : 'Add card',
      body: '<div class="aw-form">' +
        '<label><span>Card number</span><input id="c-num" value="' + esc(card ? card.cardNumber : '') + '"/></label>' +
        '<label><span>Owner</span><input id="c-owner" value="' + esc(card ? card.owner : '') + '"/></label>' +
        '<label><span>Bank</span><input id="c-bank" value="' + esc(card ? card.bank : '') + '"/></label>' +
        '<label><span>Type</span><select id="c-type">' +
        ['uzcard', 'humo', 'visa', 'mastercard'].map(t => '<option value="' + t + '"' + (card && card.type === t ? ' selected' : '') + '>' + t + '</option>').join('') +
        '</select></label>' +
        '<label><span>Expiry (MM/YY)</span><input id="c-exp" value="' + esc(card ? card.expiry : '') + '"/></label>' +
        '<label><span>Status</span><select id="c-status">' +
        '<option value="active"' + (card && card.status === 'active' ? ' selected' : '') + '>Active</option>' +
        '<option value="inactive"' + (card && card.status === 'inactive' ? ' selected' : '') + '>Inactive</option>' +
        '</select></label>' +
        '<label class="aw-checkbox"><input type="checkbox" id="c-default"' + (card && card.isDefault ? ' checked' : '') + '/><span>Default</span></label>' +
        '</div>',
      actions: [
        { label: 'Cancel', className: 'aw-btn-ghost', onClick: () => closeModal() },
        { label: 'Save', className: 'aw-btn-primary', onClick: async () => {
          const payload = {
            cardNumber: document.getElementById('c-num').value,
            owner: document.getElementById('c-owner').value,
            bank: document.getElementById('c-bank').value,
            type: document.getElementById('c-type').value,
            expiry: document.getElementById('c-exp').value,
            status: document.getElementById('c-status').value,
            isDefault: document.getElementById('c-default').checked
          };
          if (isEdit) payload.id = card.id;
          const r = isEdit ? await API.adminPut('cards', payload) : await API.adminPost('cards', payload);
          if (r.success) { toast('Saved.', 'success'); closeModal(); load(); }
          else toast(r.message, 'error');
        }}
      ]
    });
  }

  document.getElementById('c-add').addEventListener('click', () => openCardModal(null));
  document.getElementById('c-refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
