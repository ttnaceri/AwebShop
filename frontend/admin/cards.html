<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cards — Admin</title>
<link rel="stylesheet" href="../css/main.css"/><link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/><link rel="stylesheet" href="../css/responsive.css"/></head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content"><p id="admin-subtitle" class="admin-sub"></p></div>
</div>
<script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script>
<script src="../js/admin.js"></script><script src="../components/modals.js"></script><script src="../components/admin-console.js"></script>
<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  buildCrudPage({
    title: 'Payment Cards',
    subtitle: 'Cards shown to users for manual top-up',
    endpoint: 'cards',
    idField: 'id',
    columns: [
      { label: 'Card', render: r => '**** ' + esc(String(r.cardNumber || '').slice(-4)) },
      { label: 'Owner', render: r => esc(r.owner) },
      { label: 'Bank', render: r => esc(r.bank) },
      { label: 'Type', render: r => esc(r.type) },
      { label: 'Expiry', render: r => esc(r.expiry) },
      { label: 'Status', render: r => r.status === 'active' ? statusPill('active') : statusPill('cancelled') },
      { label: 'Default', render: r => r.isDefault ? '⭐' : '' }
    ],
    formFields: [
      { key: 'cardNumber', label: 'Card number', type: 'text' },
      { key: 'owner', label: 'Owner name', type: 'text' },
      { key: 'bank', label: 'Bank', type: 'text' },
      { key: 'type', label: 'Type', type: 'select', options: [
        { value: 'uzcard', label: 'UzCard' },
        { value: 'humo', label: 'Humo' },
        { value: 'visa', label: 'Visa' },
        { value: 'mastercard', label: 'MasterCard' }
      ], default: 'uzcard' },
      { key: 'expiry', label: 'Expiry (MM/YY)', type: 'text' },
      { key: 'status', label: 'Status', type: 'select', options: [
        { value: 'active', label: 'Active' },
        { value: 'inactive', label: 'Inactive' }
      ], default: 'active' },
      { key: 'isDefault', label: 'Default', type: 'checkbox' }
    ]
  });
})();
</script>
</body></html>
