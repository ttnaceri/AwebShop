<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dashboard — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-kpis" id="kpis"></div>
    <div class="admin-card">
      <h3>Recent activity</h3>
      <div id="recent"></div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Dashboard', 'Overview of AWebShop');

  const stats = Admin.adminData || {};
  const kpis = [
    { label: 'Users',       value: stats.users || 0,       ico: '👤' },
    { label: 'Websites',    value: stats.websites || 0,    ico: '🌐' },
    { label: 'Active',      value: stats.activeWebsites || 0, ico: '✅' },
    { label: 'Orders',      value: stats.orders || 0,      ico: '🛒' },
    { label: 'Escrows',     value: stats.escrows || 0,     ico: '🔐' },
    { label: 'Withdrawals', value: stats.withdrawals || 0, ico: '💸' },
    { label: 'Revenue',     value: fmtMoney(stats.revenue || 0), ico: '💰' },
    { label: 'AWC',         value: (stats.awcCirculation || 0).toFixed(2), ico: '🪙' }
  ];

  document.getElementById('kpis').innerHTML = kpis.map(k => `
    <div class="admin-kpi">
      <div class="admin-kpi-ico">${k.ico}</div>
      <div>
        <div class="admin-kpi-value">${esc(k.value)}</div>
        <div class="admin-kpi-label">${esc(k.label)}</div>
      </div>
    </div>
  `).join('');

  const logsRes = await API.adminLogs();
  const host = document.getElementById('recent');
  if (logsRes.success && logsRes.data.items.length) {
    renderTable(host,
      [
        { label: 'Time', render: r => fmtDateShort(r.timestamp) },
        { label: 'Admin', render: r => esc(r.adminId) },
        { label: 'Action', render: r => esc(r.action) },
        { label: 'Target', render: r => esc(r.target || '—') }
      ],
      logsRes.data.items.slice(-10).reverse()
    );
  } else {
    host.innerHTML = '<div class="admin-empty">No activity yet.</div>';
  }
})();
</script>
</body>
</html>
