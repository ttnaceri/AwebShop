<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Environment — Admin</title>
<link rel="stylesheet" href="../css/main.css"/><link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/><link rel="stylesheet" href="../css/responsive.css"/></head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content"><p id="admin-subtitle" class="admin-sub"></p></div>
</div>
<script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script>
<script src="../js/admin.js"></script><script src="../components/modals.js"></script><script src="../components/admin-console.js"></script>
<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Environment', 'Restricted access accounts (government/bank)');

  const content = document.querySelector('.admin-content');
  content.insertAdjacentHTML('beforeend', `
    <div class="admin-toolbar">
      <input id="env-name" placeholder="Name"/>
      <input id="env-org" placeholder="Organization"/>
      <input id="env-code" placeholder="Access code (min 6)"/>
      <button class="aw-btn aw-btn-primary" id="env-add">+ Create</button>
      <button class="aw-btn aw-btn-ghost" id="env-refresh">Refresh</button>
    </div>
    <div id="env-host"></div>
  `);

  async function load() {
    const r = await API.adminGet('environment');
    if (!r.success) return;
    renderTable(document.getElementById('env-host'),
      [
        { label: 'ID', render: x => `<code>${esc(x.id)}</code>` },
        { label: 'Name', render: x => esc(x.name) },
        { label: 'Organization', render: x => esc(x.organization) },
        { label: 'Rating', render: x => (x.rating || 0).toFixed(1) },
        { label: 'Created', render: x => fmtDateShort(x.createdAt) },
        { label: 'Actions', render: x => `<button class="admin-btn-sm bad" data-del="${esc(x.id)}">Delete</button>` }
      ], r.data.items, { emptyText: 'No environment users.' }
    );
    document.querySelectorAll('button[data-del]').forEach(b => {
      b.addEventListener('click', async () => {
        if (!(await confirmModal('Delete?', 'This environment user will lose access.'))) return;
        await API.adminDelete('environment', { id: b.dataset.del });
        load();
      });
    });
  }

  document.getElementById('env-add').addEventListener('click', async () => {
    const name = document.getElementById('env-name').value.trim();
    const organization = document.getElementById('env-org').value.trim();
    const accessCode = document.getElementById('env-code').value.trim();
    if (!name || !accessCode) return toast('Name and access code required.', 'error');
    const r = await API.adminPost('environment', { name, organization, accessCode });
    if (r.success) { toast('Created.', 'success'); ['env-name','env-org','env-code'].forEach(id => document.getElementById(id).value = ''); load(); }
    else toast(r.message, 'error');
  });
  document.getElementById('env-refresh').addEventListener('click', load);
  load();
})();
</script>
</body></html>
