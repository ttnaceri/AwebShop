<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Export/Import — Admin</title>
<link rel="icon" type="image/png" href="/frontend/assets/image/logo.png">
<link rel="stylesheet" href="../css/main.css"/><link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/><link rel="stylesheet" href="../css/responsive.css"/></head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content"><p id="admin-subtitle" class="admin-sub"></p></div>
</div>
<script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script>
<script src="../js/admin.js"></script><script src="../components/modals.js"></script><script src="../components/admin-console.js"></script>
<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Export / Import', 'CSV and JSON transfers');

  const content = document.querySelector('.admin-content');
  content.insertAdjacentHTML('beforeend', `
    <div class="admin-grid-2">
      <div class="admin-card">
        <h3>Export</h3>
        <div class="aw-form">
          <label><span>Type</span>
            <select id="ex-type">
              <option value="users">Users</option>
              <option value="websites">Websites</option>
              <option value="orders">Orders</option>
              <option value="transactions">Transactions</option>
            </select>
          </label>
          <label><span>Format</span>
            <select id="ex-format">
              <option value="json">JSON</option>
              <option value="csv">CSV</option>
            </select>
          </label>
        </div>
        <button class="aw-btn aw-btn-primary" id="ex-go" style="margin-top:12px">Download</button>
      </div>
      <div class="admin-card">
        <h3>Import</h3>
        <div class="aw-form">
          <label><span>Type</span>
            <select id="im-type">
              <option value="users">Users</option>
              <option value="websites">Websites</option>
              <option value="orders">Orders</option>
              <option value="transactions">Transactions</option>
            </select>
          </label>
          <label><span>JSON array (paste here)</span><textarea id="im-json" rows="8" placeholder='[{"id":"...","nickname":"..."}]'></textarea></label>
        </div>
        <button class="aw-btn aw-btn-danger" id="im-go" style="margin-top:12px">Import</button>
      </div>
    </div>
  `);

  document.getElementById('ex-go').addEventListener('click', async () => {
    const type = document.getElementById('ex-type').value;
    const format = document.getElementById('ex-format').value;
    const base = window.API_BASE || '';
    const token = API.getToken();
    const res = await fetch(`${base}/api/admin/export?type=${type}&format=${format}`, {
      headers: { Authorization: 'Bearer ' + token }
    });
    if (format === 'csv') {
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `awebshop-${type}.csv`; a.click();
    } else {
      const data = await res.json();
      const blob = new Blob([JSON.stringify(data.data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `awebshop-${type}.json`; a.click();
    }
  });

  document.getElementById('im-go').addEventListener('click', async () => {
    const type = document.getElementById('im-type').value;
    let parsed;
    try { parsed = JSON.parse(document.getElementById('im-json').value); }
    catch (e) { return toast('Invalid JSON.', 'error'); }
    if (!Array.isArray(parsed)) return toast('Must be an array.', 'error');
    const ok = await confirmModal('Import data?', `Merging ${parsed.length} items into ${type}.`);
    if (!ok) return;
    const r = await API.adminPost('import', { type, items: parsed });
    if (r.success) toast(r.message, 'success');
    else toast(r.message, 'error');
  });
})();
</script>
</body></html>
