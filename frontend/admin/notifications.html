<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Notifications — Admin</title>
<link rel="stylesheet" href="../css/main.css"/><link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/><link rel="stylesheet" href="../css/responsive.css"/></head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content"><p id="admin-subtitle" class="admin-sub"></p></div>
</div>
<script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script>
<script src="../js/admin.js"></script><script src="../components/modals.js"></script><script src="../components/admin-console.js"></script>
<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Notifications', 'System notifications for users');

  const content = document.querySelector('.admin-content');
  content.insertAdjacentHTML('beforeend', `
    <div class="admin-toolbar">
      <input id="nt-user" placeholder="User ID (optional)"/>
      <input id="nt-title" placeholder="Title"/>
      <button class="aw-btn aw-btn-primary" id="nt-add">+ Create</button>
      <button class="aw-btn aw-btn-ghost" id="nt-refresh">Refresh</button>
    </div>
    <div id="nt-host"></div>
  `);

  async function load() {
    const r = await API.adminGet('notifications');
    if (!r.success) return;
    renderTable(document.getElementById('nt-host'),
      [
        { label: 'Target', render: x => esc(x.userId || 'all') },
        { label: 'Title', render: x => esc(x.title) },
        { label: 'Body', render: x => esc((x.body || '').slice(0, 80)) },
        { label: 'Created', render: x => fmtDateShort(x.createdAt) },
        { label: 'Actions', render: x => `<button class="admin-btn-sm bad" data-del="${esc(x.id)}">Delete</button>` }
      ], r.data.items, { emptyText: 'No notifications.' }
    );
    document.querySelectorAll('button[data-del]').forEach(b => {
      b.addEventListener('click', async () => { await API.adminDelete('notifications', { id: b.dataset.del }); load(); });
    });
  }

  document.getElementById('nt-add').addEventListener('click', async () => {
    const userId = document.getElementById('nt-user').value.trim() || null;
    const title = document.getElementById('nt-title').value.trim();
    if (!title) return toast('Title required.', 'error');
    const r = await API.adminPost('notifications', { userId, title, body: '' });
    if (r.success) { toast('Created.', 'success'); load(); }
    else toast(r.message, 'error');
  });
  document.getElementById('nt-refresh').addEventListener('click', load);
  load();
})();
</script>
</body></html>
