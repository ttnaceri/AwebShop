<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Users — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-toolbar">
      <input id="u-search" placeholder="Search users…"/>
      <select id="u-filter">
        <option value="">All</option>
        <option value="blocked">Blocked</option>
        <option value="banned">Banned</option>
      </select>
      <button class="aw-btn aw-btn-ghost" id="u-refresh">Refresh</button>
    </div>
    <div id="users-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Users', 'Manage platform accounts');

  let all = [];
  const host = document.getElementById('users-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const r = await API.adminGet('users');
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed: ' + esc(r.message || '') + '</div>'; return; }
    all = r.data.items || [];
    render();
  }

  function render() {
    const q = document.getElementById('u-search').value.trim().toLowerCase();
    const f = document.getElementById('u-filter').value;
    let list = all.slice();
    if (q) list = list.filter(u =>
      (u.nickname || '').toLowerCase().includes(q) ||
      (u.id || '').includes(q) ||
      (u.telegramUsername || '').toLowerCase().includes(q)
    );
    if (f === 'blocked') list = list.filter(u => u.blocked && !u.banned);
    if (f === 'banned') list = list.filter(u => u.banned);

    renderTable(host,
      [
        { label: 'ID', render: r => '<code>' + esc(r.id) + '</code>' },
        { label: 'Nickname', render: r => esc(r.nickname) },
        { label: 'Telegram', render: r => esc(r.telegramUsername || '—') },
        { label: 'AWC', render: r => (r.balanceAWC || 0).toFixed(2) },
        { label: 'Role', render: r => esc(r.role || 'user') },
        { label: 'Status', render: r => r.banned ? statusPill('banned') : (r.blocked ? statusPill('blocked') : statusPill('active')) },
        { label: 'Joined', render: r => fmtDateShort(r.createdAt) },
        { label: 'Actions', render: r => `
          <div class="admin-actions">
            ${r.banned
              ? '<button class="admin-btn-sm ok" data-act="unban" data-id="' + esc(r.id) + '">Unban</button>'
              : (r.blocked
                ? '<button class="admin-btn-sm ok" data-act="unban" data-id="' + esc(r.id) + '">Unblock</button>'
                : '<button class="admin-btn-sm bad" data-act="ban" data-id="' + esc(r.id) + '">Ban</button>')}
          </div>
        ` }
      ],
      list,
      { emptyText: 'No users.' }
    );

    host.querySelectorAll('button[data-act]').forEach(b => {
      b.addEventListener('click', () => {
        const id = b.dataset.id;
        const act = b.dataset.act;
        if (act === 'ban') banUser(id);
        if (act === 'unban') unbanUser(id);
      });
    });
  }

  async function banUser(id) {
    openModal({
      title: 'Ban user',
      body: '<div class="aw-form">' +
        '<label><span>Reason</span><input id="ban-reason"/></label>' +
        '<label><span>Duration</span>' +
        '<select id="ban-duration">' +
        '<option value="1h">1 hour</option>' +
        '<option value="1d" selected>1 day</option>' +
        '<option value="1w">1 week</option>' +
        '<option value="1y">1 year</option>' +
        '<option value="">Permanent</option>' +
        '</select></label>' +
        '</div>',
      actions: [
        { label: 'Cancel', className: 'aw-btn-ghost', onClick: () => closeModal() },
        { label: 'Ban', className: 'aw-btn-danger', onClick: async () => {
          const reason = document.getElementById('ban-reason').value;
          const duration = document.getElementById('ban-duration').value;
          const r = await API.adminPost('users/ban-duration', { userId: id, duration, reason });
          if (r.success) { toast(r.data.message || 'Banned', 'success'); closeModal(); load(); }
          else toast(r.message, 'error');
        }}
      ]
    });
  }

  async function unbanUser(id) {
    if (!(await confirmModal('Unban?', 'Restore access?'))) return;
    const r = await API.adminPost('users/unban', { userId: id });
    if (r.success) { toast('Unbanned', 'success'); load(); }
    else toast(r.message, 'error');
  }

  document.getElementById('u-search').addEventListener('input', render);
  document.getElementById('u-filter').addEventListener('change', render);
  document.getElementById('u-refresh').addEventListener('click', load);

  load();
})();
</script>
</body>
</html>
