<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Users — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>

    <div class="admin-toolbar">
      <button class="aw-btn aw-btn-primary" id="u-create">+ Create user</button>
      <input id="u-search" placeholder="Search by nickname, ID, telegram…"/>
      <select id="u-filter">
        <option value="">All</option>
        <option value="blocked">Blocked</option>
        <option value="banned">Banned</option>
        <option value="verified">Verified</option>
        <option value="unverified">Unverified</option>
      </select>
      <button class="aw-btn aw-btn-ghost" id="u-refresh">Refresh</button>
    </div>

    <div id="users-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>
<script src="../components/admin-console.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Users', 'Manage platform accounts');

  let all = [];
  const host = document.getElementById('users-host');
  const isSuperAdmin = Admin.role === 'super_admin';

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const r = await API.adminGet('users');
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed.</div>'; return; }
    all = r.data.items;
    render();
  }

  function userStatus(u) {
    if (u.banned) return statusPill('banned');
    if (u.blocked && u.blockedUntil) {
      const until = new Date(u.blockedUntil).getTime();
      if (until > Date.now()) return statusPill('blocked');
      return statusPill('active');
    }
    if (u.blocked) return statusPill('blocked');
    return statusPill('active');
  }

  function render() {
    const q = document.getElementById('u-search').value.trim().toLowerCase();
    const f = document.getElementById('u-filter').value;
    let list = all.slice();
    if (q) list = list.filter(u =>
      (u.nickname || '').toLowerCase().includes(q) ||
      (u.id || '').includes(q) ||
      (u.telegramUsername || '').toLowerCase().includes(q) ||
      (u.telegramId || '').includes(q)
    );
    if (f === 'blocked') list = list.filter(u => u.blocked && !u.banned);
    if (f === 'banned') list = list.filter(u => u.banned);
    if (f === 'verified') list = list.filter(u => u.verified);
    if (f === 'unverified') list = list.filter(u => !u.verified);

    renderTable(host,
      [
        { label: 'ID', render: r => `<code>${esc(r.id)}</code>` },
        { label: 'Nickname', render: r => esc(r.nickname) },
        { label: 'Telegram', render: r => `${esc(r.telegramUsername || '')}<br><small>${esc(r.telegramId || '')}</small>` },
        { label: 'AWC', render: r => fmtAWC(r.balanceAWC) },
        { label: 'Strikes', render: r => {
          const c = (r.moderationStrikes && r.moderationStrikes.count) || 0;
          return c > 0 ? `<span class="admin-pill admin-pill-warn">${c}/3</span>` : '0/3';
        }},
        { label: 'Status', render: r => userStatus(r) },
        { label: 'Joined', render: r => fmtDateShort(r.createdAt) },
        { label: 'Actions', render: r => `
          <div class="admin-actions">
            <button class="admin-btn-sm" data-act="view" data-id="${esc(r.id)}">View</button>
            ${r.banned
              ? `<button class="admin-btn-sm ok" data-act="unban" data-id="${esc(r.id)}">Unban</button>`
              : r.blocked
                ? `<button class="admin-btn-sm ok" data-act="unban" data-id="${esc(r.id)}">Unblock</button>`
                : `<button class="admin-btn-sm bad" data-act="ban" data-id="${esc(r.id)}">Ban</button>`}
          </div>
        ` }
      ],
      list,
      { emptyText: 'No users.' }
    );

    host.querySelectorAll('button[data-act]').forEach(b => {
      b.addEventListener('click', () => {
        const id = b.dataset.id;
        const act = b.dataset.act;
        if (act === 'view') return viewUser(id);
        if (act === 'ban') return banUser(id);
        if (act === 'unban') return unbanUser(id);
      });
    });
  }

  // ---- Create user ----
  document.getElementById('u-create').addEventListener('click', () => {
    if (!isSuperAdmin) { toast('Only SuperAdmin can create users.', 'error'); return; }
    openModal({
      title: 'Create user',
      body: `
        <div class="aw-form">
          <label><span>Nickname</span><input id="cu-nick"/></label>
          <label><span>Password</span><input id="cu-pass" type="password"/></label>
          <label><span>Phone</span><input id="cu-phone"/></label>
          <label><span>Telegram username</span><input id="cu-tgu" placeholder="@username"/></label>
          <label><span>Telegram ID</span><input id="cu-tgi"/></label>
          <label><span>Role</span>
            <select id="cu-role">
              <option value="user">User</option>
              <option value="moderator">Moderator</option>
              <option value="admin">Admin</option>
            </select>
          </label>
          <label>
            <span>Custom User ID (SuperAdmin only)</span>
            <input id="cu-id" placeholder="e.g. 123456789" maxlength="20"/>
            <small class="aw-muted">If empty, a 9-digit ID is auto-generated.</small>
          </label>
          <div class="aw-form-error" id="cu-err" hidden></div>
        </div>
      `,
      actions: [
        { label: 'Cancel', className: 'aw-btn-ghost', onClick: () => closeModal() },
        { label: 'Create', className: 'aw-btn-primary', onClick: async () => {
          const payload = {
            nickname: document.getElementById('cu-nick').value.trim(),
            password: document.getElementById('cu-pass').value,
            phone: document.getElementById('cu-phone').value.trim(),
            telegramUsername: document.getElementById('cu-tgu').value.trim(),
            telegramId: document.getElementById('cu-tgi').value.trim(),
            role: document.getElementById('cu-role').value,
            customId: document.getElementById('cu-id').value.trim() || null
          };
          if (!payload.nickname || payload.password.length < 8) {
            const e = document.getElementById('cu-err');
            e.textContent = 'Nickname required. Password min 8 chars.'; e.hidden = false; return;
          }
          const r = await API.adminPost('users/create', payload);
          if (r.success) { toast('User created.', 'success'); closeModal(); load(); }
          else { const e = document.getElementById('cu-err'); e.textContent = r.message; e.hidden = false; }
        }}
      ]
    });
  });

  // ---- View ----
  function viewUser(id) {
    const u = all.find(x => x.id === id);
    if (!u) return;
    const strikes = (u.moderationStrikes && u.moderationStrikes.count) || 0;
    openModal({
      title: u.nickname,
      body: `
        <div class="admin-kv">
          <div><span>User ID</span><code>${esc(u.id)}</code></div>
          <div><span>Nickname</span>${esc(u.nickname)}</div>
          <div><span>Telegram</span>${esc(u.telegramUsername || '—')}</div>
          <div><span>Telegram ID</span>${esc(u.telegramId || '—')}</div>
          <div><span>Phone</span>${esc(u.phone || '—')}</div>
          <div><span>AWC</span>${fmtAWC(u.balanceAWC)}</div>
          <div><span>Role</span>${esc(u.role || 'user')}</div>
          <div><span>Verified</span>${u.verified ? 'Yes' : 'No'}</div>
          <div><span>Strikes</span>${strikes}/3</div>
          <div><span>Status</span>${userStatus(u)}</div>
          <div><span>Banned</span>${u.banned ? 'Yes (' + (u.banReason || 'no reason') + ')' : 'No'}</div>
          <div><span>Joined</span>${fmtDateShort(u.createdAt)}</div>
        </div>
      `,
      actions: [{ label: 'Close', className: 'aw-btn-ghost', onClick: () => closeModal() }]
    });
  }

  // ---- Ban ----
  async function banUser(id) {
    openModal({
      title: 'Ban user',
      body: `
        <div class="aw-form">
          <label><span>Reason</span><input id="ban-reason" placeholder="Optional"/></label>
          <label><span>Duration</span>
            <select id="ban-duration">
              <option value="1h">1 hour</option>
              <option value="1d" selected>1 day</option>
              <option value="1w">1 week</option>
              <option value="1y">1 year</option>
              <option value="">Permanent</option>
            </select>
          </label>
          <div class="aw-form-error" id="ban-err" hidden></div>
        </div>
      `,
      actions: [
        { label: 'Cancel', className: 'aw-btn-ghost', onClick: () => closeModal() },
        { label: 'Ban', className: 'aw-btn-danger', onClick: async () => {
          const reason = document.getElementById('ban-reason').value;
          const duration = document.getElementById('ban-duration').value;
          const r = await API.adminPost('users/ban-duration', { userId: id, duration, reason });
          if (r.success) {
            toast(r.data.message || 'Banned.', 'success');
            closeModal();
            load();
          } else { const e = document.getElementById('ban-err'); e.textContent = r.message; e.hidden = false; }
        }}
      ]
    });
  }

  // ---- Unban ----
  async function unbanUser(id) {
    const ok = await confirmModal('Unban user?', 'This will restore access.');
    if (!ok) return;
    const r = await API.adminPost('users/unban', { userId: id });
    if (r.success) { toast('Unbanned.', 'success'); load(); }
    else toast(r.message, 'error');
  }

  document.getElementById('u-search').addEventListener('input', render);
  document.getElementById('u-filter').addEventListener('change', render);
  document.getElementById('u-refresh').addEventListener('click', load);

  load();
})();
</script>
</body>
</html>
