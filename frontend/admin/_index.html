<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Admin — AWebShop</title>
<link rel="stylesheet" href="../css/main.css"/></head>
<body class="aw-body">
<main class="aw-page aw-auth-page">
  <div class="aw-auth-card">
    <h1>Admin</h1>
    <p class="aw-muted">Admin panelga kirish uchun super admin hisobingiz bilan tizimga kiring.</p>
    <div id="msg" class="aw-muted" style="margin:20px 0"></div>
    <a class="aw-btn aw-btn-primary aw-btn-block" href="../pages/login.html?next=../admin/dashboard.html">Login</a>
  </div>
</main>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script>
(async () => {
  await Auth.load();
  const stats = await API.adminStats();
  if (stats.success) {
    location.replace('dashboard.html');
    return;
  }
  document.getElementById('msg').textContent = 'Hozircha admin emassiz. Login qiling va admin ruxsatini oling.';
})();
</script>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>
<script src="../components/charts.js"></script>
<script src="../components/admin-console.js"></script>
</body></html>
