<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Escrow — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-toolbar">
      <select id="e-filter">
        <option value="">All</option>
        <option value="pending">Pending</option>
        <option value="paid">Paid</option>
        <option value="transferred">Transferred</option>
        <option value="verified">Verified</option>
        <option value="completed">Completed</option>
        <option value="disputed">Disputed</option>
        <option value="refunded">Refunded</option>
      </select>
      <button class="aw-btn aw-btn-ghost" id="e-refresh">Refresh</button>
    </div>
    <div id="escrow-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Escrow', 'Safe-deal escrow queue');

  let all = [];
  const host = document.getElementById('escrow-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const r = await API.adminGet('escrow');
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed: ' + esc(r.message || '') + '</div>'; return; }
    all = r.data.items || [];
    render();
  }

  function render() {
    const f = document.getElementById('e-filter').value;
    const list = f ? all.filter(e => e.status === f) : all;

    renderTable(host,
      [
        { label: 'ID', render: r => '<code>' + esc(r.id) + '</code>' },
        { label: 'Website', render: r => '<code>' + esc(r.websiteId) + '</code>' },
        { label: 'Buyer', render: r => esc(r.buyerId) },
        { label: 'Seller', render: r => esc(r.sellerId) },
        { label: 'UZS', render: r => fmtMoney(r.amountUZS) },
        { label: 'AWC', render: r => (r.amountAWC || 0).toFixed(2) },
        { label: 'Status', render: r => statusPill(r.status) },
        { label: 'Created', render: r => fmtDateShort(r.createdAt) },
        { label: 'Actions', render: r => `<button class="admin-btn-sm" data-id="${esc(r.id)}">Manage</button>` }
      ],
      list,
      { emptyText: 'No escrow items.' }
    );

    host.querySelectorAll('button[data-id]').forEach(b => {
      b.addEventListener('click', () => manage(b.dataset.id));
    });
  }

  function manage(id) {
    const e = all.find(x => x.id === id);
    if (!e) return;
    openModal({
      title: 'Escrow ' + id,
      body: '<div class="aw-form">' +
        '<label><span>Status</span>' +
        '<select id="es-status">' +
        ['pending','paid','transferred','verified','completed','cancelled','disputed','refunded']
          .map(s => '<option value="' + s + '"' + (s === e.status ? ' selected' : '') + '>' + s + '</option>').join('') +
        '</select></label>' +
        '<label><span>Admin notes</span><textarea id="es-notes" rows="3">' + esc(e.adminNotes || '') + '</textarea></label>' +
        '</div>',
      actions: [
        { label: 'Cancel', className: 'aw-btn-ghost', onClick: () => closeModal() },
        { label: 'Save', className: 'aw-btn-primary', onClick: async () => {
          const status = document.getElementById('es-status').value;
          const adminNotes = document.getElementById('es-notes').value;
          const r = await API.adminPost('escrow/update', { escrowId: id, status, adminNotes });
          if (r.success) { toast('Updated', 'success'); closeModal(); load(); }
          else toast(r.message, 'error');
        }}
      ]
    });
  }

  document.getElementById('e-filter').addEventListener('change', render);
  document.getElementById('e-refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
