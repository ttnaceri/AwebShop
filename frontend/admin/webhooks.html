<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Webhooks — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/>
<link rel="stylesheet" href="../css/uploader.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>
<script src="../components/admin-console.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;

  buildCrudPage({
    title: I18N.t('webhooks'),
    subtitle: I18N.t('webhooksDescription'),
    endpoint: 'webhooks',
    idField: 'id',
    columns: [
      { label: I18N.t('webhookUrl'), render: r => `<code>${esc(r.url)}</code>` },
      { label: I18N.t('webhookEvent'), render: r => `<span class="admin-pill admin-pill-neutral">${esc(r.event)}</span>` },
      { label: I18N.t('webhookSecret'), render: r => r.secret ? '••••••' : '—' },
      { label: I18N.t('webhookActive'), render: r => r.active ? statusPill('active') : statusPill('cancelled') },
      { label: I18N.t('created'), render: r => fmtDateShort(r.createdAt) }
    ],
    formFields: [
      { key: 'url', label: I18N.t('webhookUrl'), type: 'text', default: 'https://' },
      { key: 'event', label: I18N.t('webhookEvent'), type: 'select', options: [
        { value: 'user.registered', label: I18N.t('eventUserRegistered') },
        { value: 'website.created', label: I18N.t('eventWebsiteCreated') },
        { value: 'order.created', label: I18N.t('eventOrderCreated') },
        { value: 'escrow.updated', label: I18N.t('eventEscrowUpdated') },
        { value: 'payment.verified', label: I18N.t('eventPaymentVerified') }
      ], default: 'user.registered' },
      { key: 'secret', label: I18N.t('webhookSecret'), type: 'text' },
      { key: 'active', label: I18N.t('webhookActive'), type: 'checkbox', default: true }
    ]
  });
})();
</script>
</body>
</html>
