<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Analytics — Admin</title>
<link rel="icon" type="image/png" href="/frontend/assets/image/logo.png">
<link rel="stylesheet" href="../css/main.css"/><link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/><link rel="stylesheet" href="../css/responsive.css"/></head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content"><p id="admin-subtitle" class="admin-sub"></p></div>
</div>
<script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script>
<script src="../js/admin.js"></script><script src="../components/charts.js"></script><script src="../components/admin-console.js"></script>
<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Analytics', 'Trends, topics, payment methods');

  const content = document.querySelector('.admin-content');
  content.insertAdjacentHTML('beforeend', `
    <div class="admin-grid-2">
      <div class="admin-card"><h3>Users trend (14 days)</h3><canvas id="an-users" class="admin-chart"></canvas></div>
      <div class="admin-card"><h3>Revenue trend (14 days)</h3><canvas id="an-rev" class="admin-chart"></canvas></div>
    </div>
    <div class="admin-card"><h3>Topics distribution</h3><canvas id="an-topics" class="admin-chart" style="height:220px"></canvas></div>
    <div class="admin-card"><h3>Payment methods</h3><div id="an-pm" class="admin-pre"></div></div>
  `);

  const stats = await API.adminGet('stats');
  if (stats.success) {
    const t = stats.data.trend || [];
    lineChart(document.getElementById('an-users'), { labels: t.map(x => x.date), values: t.map(x => x.users) });
    barChart(document.getElementById('an-rev'), { labels: t.map(x => x.date), values: t.map(x => x.revenue), color: '#22c55e' });
  }

  const an = await API.adminGet('analytics');
  if (an.success) {
    const topicKeys = Object.keys(an.data.topicCounts || {});
    barChart(document.getElementById('an-topics'), {
      labels: topicKeys,
      values: topicKeys.map(k => an.data.topicCounts[k])
    });
    document.getElementById('an-pm').textContent = JSON.stringify(an.data.paymentMethods || {}, null, 2);
  }
})();
</script>

</body></html>
