<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Analytics — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-grid-2">
      <div class="admin-card"><h3>Key metrics</h3><div id="metrics"></div></div>
      <div class="admin-card"><h3>By topic</h3><div id="by-topic"></div></div>
    </div>
    <div class="admin-card"><h3>Payment methods</h3><div id="by-pm"></div></div>
  </div>
</div>
<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>
<script src="../components/admin-console.js"></script>
<script>
(async () => {
  if (!(await Admin.requireAdmin())) return;
  adminPage('Analytics', 'Statistics and metrics');

  var stats = Admin.adminData || {};

  document.getElementById('metrics').innerHTML =
    '<div class="admin-kv">' +
    '<div><span>Total users</span>' + esc(String(stats.users || 0)) + '</div>' +
    '<div><span>Total websites</span>' + esc(String(stats.websites || 0)) + '</div>' +
    '<div><span>Active websites</span>' + esc(String(stats.activeWebsites || 0)) + '</div>' +
    '<div><span>Sold websites</span>' + esc(String(stats.soldWebsites || 0)) + '</div>' +
    '<div><span>Total orders</span>' + esc(String(stats.orders || 0)) + '</div>' +
    '<div><span>Transactions</span>' + esc(String(stats.transactions || 0)) + '</div>' +
    '<div><span>Escrows</span>' + esc(String(stats.escrows || 0)) + '</div>' +
    '<div><span>Withdrawals</span>' + esc(String(stats.withdrawals || 0)) + '</div>' +
    '<div><span>Revenue</span>' + fmtMoney(stats.revenue || 0) + '</div>' +
    '<div><span>AWC circulation</span>' + esc((stats.awcCirculation || 0).toFixed(2)) + '</div>' +
    '</div>';

  var r = await API.adminGet('analytics');
  if (r && r.success) {
    var topics = r.data.topicCounts || {};
    var tkeys = Object.keys(topics);
    if (tkeys.length) {
      document.getElementById('by-topic').innerHTML = renderTable(null, [], []) ||
        '<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Topic</th><th>Count</th></tr></thead><tbody>' +
        tkeys.map(function (k) { return '<tr><td>' + esc(k) + '</td><td>' + topics[k] + '</td></tr>'; }).join('') +
        '</tbody></table></div>';
    } else {
      document.getElementById('by-topic').innerHTML = '<div class="admin-empty">No data.</div>';
    }

    var pms = r.data.paymentMethods || {};
    var pkeys = Object.keys(pms);
    document.getElementById('by-pm').innerHTML = pkeys.length
      ? '<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Method</th><th>Count</th></tr></thead><tbody>' +
        pkeys.map(function (k) { return '<tr><td>' + esc(k) + '</td><td>' + pms[k] + '</td></tr>'; }).join('') +
        '</tbody></table></div>'
      : '<div class="admin-empty">No payment data.</div>';
  }
})();
</script>
</body>
</html>
