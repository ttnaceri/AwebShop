<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Orders — Admin</title>
<link rel="stylesheet" href="../css/main.css"/><link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/><link rel="stylesheet" href="../css/responsive.css"/></head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content"><p id="admin-subtitle" class="admin-sub"></p></div>
</div>
<script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script>
<script src="../js/admin.js"></script><script src="../components/admin-console.js"></script>
<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Orders', 'All marketplace orders');

  const content = document.querySelector('.admin-content');
  content.insertAdjacentHTML('beforeend', `<div id="ord-host"></div>`);

  const stats = await API.adminStats();
  // orders are in stats; get from a dedicated endpoint if needed. Here we use transactions.
  const tx = await API.adminGet('transactions');
  const orders = (tx.success ? tx.data.items : []).filter(t => t.type.startsWith('order'));

  renderTable(document.getElementById('ord-host'),
    [
      { label: 'Order ID', render: x => `<code>${esc(x.referenceId || x.id)}</code>` },
      { label: 'User', render: x => esc(x.userId) },
      { label: 'Amount', render: x => fmtMoney(x.amountUZS) },
      { label: 'Status', render: x => statusPill(x.status) },
      { label: 'Created', render: x => fmtDateShort(x.createdAt) }
    ], orders, { emptyText: 'No orders yet.' }
  );
})();
</script>
</body></html>
