<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Admin — AWebShop</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
<style>
body.aw-body {
  opacity: 1 !important;
  visibility: visible !important;
}
.aw-admin-landing {
  max-width: 560px;
  margin: 60px auto;
  padding: 40px 32px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  text-align: center;
}
.aw-admin-landing h1 { font-size: 28px; margin-bottom: 8px; }
.aw-admin-landing .aw-admin-msg {
  padding: 16px;
  background: var(--bg);
  border: 1px dashed var(--border);
  border-radius: 10px;
  margin: 20px 0;
  font-size: 14px;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.aw-admin-landing .aw-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}
</style>
</head>
<body class="aw-body">
<div id="aw-header"></div>

<main class="aw-page">
  <div class="aw-admin-landing">
    <h1>🛡️ Admin Panel</h1>
    <p class="aw-muted">AWebShop management center</p>

    <div class="aw-admin-msg" id="msg">
      <span class="aw-loading" style="padding:0;background:none;border:none">Checking access…</span>
    </div>

    <div class="aw-actions">
      <a class="aw-btn aw-btn-primary aw-btn-block" href="dashboard.html">
        <i class="fa-solid fa-gauge"></i> Go to Dashboard
      </a>
      <a class="aw-btn aw-btn-ghost aw-btn-block" href="../pages/login.html?next=../admin/dashboard.html">
        <i class="fa-solid fa-right-to-bracket"></i> Login as Admin
      </a>
      <a class="aw-btn aw-btn-ghost aw-btn-block" href="../pages/main.html">
        <i class="fa-solid fa-arrow-left"></i> Back to site
      </a>
    </div>
  </div>
</main>

<div id="aw-footer"></div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../components/header.js"></script>
<script src="../components/footer.js"></script>

<script>
(async () => {
  const msgEl = document.getElementById('msg');

  try {
    if (!window.Auth || typeof window.Auth.load !== 'function') {
      msgEl.textContent = '❌ Auth module missing.';
      return;
    }

    await Auth.load();

    if (!Auth.isLoggedIn()) {
      msgEl.innerHTML = `
        <div style="text-align:center">
          <div style="font-size:32px;margin-bottom:8px">🔒</div>
          <div>You are not logged in.</div>
          <div class="aw-muted" style="font-size:12px;margin-top:4px">Please login to continue.</div>
        </div>
      `;
      return;
    }

    if (!window.API || typeof window.API.adminStats !== 'function') {
      msgEl.textContent = '❌ API module missing.';
      return;
    }

    const r = await API.adminStats();

    if (r && r.success) {
      const u = Auth.user || {};
      msgEl.innerHTML = `
        <div style="text-align:center">
          <div style="font-size:32px;margin-bottom:8px">✅</div>
          <div><b>Welcome, ${u.nickname || 'Admin'}!</b></div>
          <div class="aw-muted" style="font-size:12px;margin-top:4px">Role: ${(u.role || 'moderator').toUpperCase()}</div>
          <div class="aw-muted" style="font-size:12px">Redirecting…</div>
        </div>
      `;
      setTimeout(() => location.href = 'dashboard.html', 900);
    } else {
      msgEl.innerHTML = `
        <div style="text-align:center">
          <div style="font-size:32px;margin-bottom:8px">⛔</div>
          <div>You do not have admin privileges.</div>
          <div class="aw-muted" style="font-size:12px;margin-top:4px">Contact SuperAdmin.</div>
        </div>
      `;
    }
  } catch (e) {
    console.error('[admin:index]', e);
    msgEl.textContent = 'Error: ' + (e.message || 'Unknown');
  }
})();
</script>
</body>
</html>
