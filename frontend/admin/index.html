<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Admin — AWebShop</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="aw-body">
<main class="aw-page aw-auth-page">
  <div class="aw-auth-card" style="text-align:center">
    <h1 style="margin-bottom:8px">🛡️ Admin Panel</h1>
    <p class="aw-muted">AWebShop management center</p>

    <div id="msg" style="padding:24px;background:var(--card);border:1px dashed var(--border);border-radius:12px;margin:20px 0;min-height:80px;display:flex;align-items:center;justify-content:center;font-size:14px">
      <span class="aw-loading" style="padding:0;background:none;border:none">Checking access…</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <a class="aw-btn aw-btn-primary aw-btn-block" href="dashboard.html">
        <i class="fa-solid fa-gauge"></i> Go to Dashboard
      </a>
      <a class="aw-btn aw-btn-ghost aw-btn-block" href="../pages/login.html?next=../admin/dashboard.html">
        <i class="fa-solid fa-right-to-bracket"></i> Login as Admin
      </a>
      <a class="aw-btn aw-btn-ghost aw-btn-block" href="../pages/main.html">
        <i class="fa-solid fa-arrow-left"></i> Back to site
      </a>
    </div>
  </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>

<script>
(async function () {
  var msgEl = document.getElementById('msg');

  try {
    await Auth.load();

    if (!Auth.isLoggedIn()) {
      msgEl.innerHTML = '<div style="text-align:center"><div style="font-size:32px;margin-bottom:8px">🔒</div><div>Not logged in.</div></div>';
      return;
    }

    var r = await API.adminStats();

    if (r && r.success) {
      var u = Auth.user || {};
      msgEl.innerHTML = '<div style="text-align:center">' +
        '<div style="font-size:32px;margin-bottom:8px">✅</div>' +
        '<div><b>Welcome, ' + (u.nickname || 'Admin') + '!</b></div>' +
        '<div class="aw-muted" style="font-size:12px;margin-top:4px">Role: ' + (u.role || 'moderator').toUpperCase() + '</div>' +
        '<div class="aw-muted" style="font-size:12px">Redirecting…</div>' +
        '</div>';
      setTimeout(function () { location.href = 'dashboard.html'; }, 800);
    } else {
      msgEl.innerHTML = '<div style="text-align:center">' +
        '<div style="font-size:32px;margin-bottom:8px">⛔</div>' +
        '<div>You do not have admin privileges.</div>' +
        '<div class="aw-muted" style="font-size:12px;margin-top:4px">Contact SuperAdmin.</div>' +
        '</div>';
    }
  } catch (e) {
    console.error('[admin:index]', e);
    msgEl.textContent = 'Error: ' + e.message;
  }
})();
</script>
</body>
</html>
