<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Discounts — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-toolbar">
      <button class="aw-btn aw-btn-primary" id="d-add">+ New discount</button>
      <button class="aw-btn aw-btn-ghost" id="d-refresh">Refresh</button>
    </div>
    <div id="discounts-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Discounts', 'Targeted discounts');

  const host = document.getElementById('discounts-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const r = await API.adminGet('discounts');
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed: ' + esc(r.message || '') + '</div>'; return; }
    render(r.data.items || []);
  }

  function render(items) {
    renderTable(host,
      [
        { label: 'Target', render: x => esc(x.target) },
        { label: 'Topics', render: x => esc((x.topics || []).join(', ') || 'all') },
        { label: 'Type', render: x => esc(x.type) },
        { label: 'Value', render: x => esc(x.value) },
        { label: 'Status', render: x => x.enabled ? statusPill('active') : statusPill('cancelled') },
        { label: 'Actions', render: x => '<div class="admin-actions"><button class="admin-btn-sm bad" data-del="' + esc(x.id) + '">Delete</button></div>' }
      ],
      items,
      { emptyText: 'No discounts yet.' }
    );
    host.querySelectorAll('button[data-del]').forEach(b => {
      b.addEventListener('click', async () => {
        if (!(await confirmModal('Delete discount?', 'Proceed?'))) return;
        const r = await API.adminDelete('discounts', { id: b.dataset.del });
        if (r.success) { toast('Deleted.', 'success'); load(); }
        else toast(r.message, 'error');
      });
    });
  }

  document.getElementById('d-add').addEventListener('click', () => {
    openModal({
      title: 'New discount',
      body: '<div class="aw-form">' +
        '<label><span>Target</span><select id="d-target">' +
        '<option value="all">All</option><option value="new">New users</option>' +
        '<option value="existing">Existing users</option><option value="selected">Selected</option>' +
        '</select></label>' +
        '<label><span>Type</span><select id="d-type">' +
        '<option value="percent">Percent</option><option value="fixed_awc">Fixed AWC</option>' +
        '</select></label>' +
        '<label><span>Value</span><input type="number" id="d-value" value="10"/></label>' +
        '<label class="aw-checkbox"><input type="checkbox" id="d-enabled" checked/><span>Enabled</span></label>' +
        '</div>',
      actions: [
        { label: 'Cancel', className: 'aw-btn-ghost', onClick: () => closeModal() },
        { label: 'Create', className: 'aw-btn-primary', onClick: async () => {
          const r = await API.adminPost('discounts', {
            target: document.getElementById('d-target').value,
            type: document.getElementById('d-type').value,
            value: Number(document.getElementById('d-value').value),
            enabled: document.getElementById('d-enabled').checked
          });
          if (r.success) { toast('Created.', 'success'); closeModal(); load(); }
          else toast(r.message, 'error');
        }}
      ]
    });
  });
  document.getElementById('d-refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
