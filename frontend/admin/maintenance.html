<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Maintenance — Admin</title>
<link rel="icon" type="image/png" href="/frontend/assets/image/logo.png">
<link rel="stylesheet" href="../css/main.css"/><link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/><link rel="stylesheet" href="../css/responsive.css"/></head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content"><p id="admin-subtitle" class="admin-sub"></p></div>
</div>
<script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script>
<script src="../js/admin.js"></script><script src="../components/admin-console.js"></script>
<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Maintenance', 'Enable maintenance mode with whitelist');

  const r = await API.adminGet('maintenance');
  const m = r.success ? r.data : {};

  const content = document.querySelector('.admin-content');
  content.insertAdjacentHTML('beforeend', `
    <div class="admin-card">
      <div class="aw-form">
        <label class="aw-checkbox"><input type="checkbox" id="m-on" ${m.enabled?'checked':''}/><span>Maintenance mode enabled</span></label>
        <label><span>Message shown to users</span><textarea id="m-msg" rows="3">${esc(m.message||'')}</textarea></label>
        <label><span>Start at (ISO, optional)</span><input id="m-start" value="${esc(m.startAt||'')}"/></label>
        <label><span>End at (ISO, optional)</span><input id="m-end" value="${esc(m.endAt||'')}"/></label>
        <label><span>Whitelisted IPs (one per line)</span><textarea id="m-wl" rows="3">${(m.whitelist||[]).join('\\n')}</textarea></label>
      </div>
      <button class="aw-btn aw-btn-primary" id="m-save" style="margin-top:14px">Save</button>
    </div>
  `);

  document.getElementById('m-save').addEventListener('click', async () => {
    const payload = {
      enabled: document.getElementById('m-on').checked,
      message: document.getElementById('m-msg').value,
      startAt: document.getElementById('m-start').value || null,
      endAt: document.getElementById('m-end').value || null,
      whitelist: document.getElementById('m-wl').value.split(/\\r?\\n/).map(x => x.trim()).filter(Boolean)
    };
    const r2 = await API.adminPut('maintenance', payload);
    if (r2.success) toast('Saved.', 'success');
    else toast(r2.message, 'error');
  });
})();
</script>
</body></html>
