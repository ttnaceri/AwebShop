<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Premium — Admin</title>
<link rel="icon" type="image/png" href="/frontend/assets/image/logo.png">
<link rel="stylesheet" href="../css/main.css"/><link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/><link rel="stylesheet" href="../css/responsive.css"/></head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content"><p id="admin-subtitle" class="admin-sub"></p></div>
</div>
<script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script>
<script src="../js/admin.js"></script><script src="../components/modals.js"></script><script src="../components/admin-console.js"></script>
<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Premium Plans', 'Edit 4 plans: Plus, Prime, Pro, Enterprise');

  const content = document.querySelector('.admin-content');
  content.insertAdjacentHTML('beforeend', `<div id="pm-host"></div>`);

  async function load() {
    const r = await API.adminGet('premium/plans');
    if (!r.success) return;
    render(r.data.items);
  }

  function render(plans) {
    const host = document.getElementById('pm-host');
    host.innerHTML = plans.map(p => `
      <div class="admin-card" data-plan="${esc(p.id)}" style="margin-bottom:12px">
        <div class="admin-card-head">
          <h3>${esc(p.name)} ${p.badge ? '🏅' : ''} ${p.enabled ? '' : '(disabled)'}</h3>
        </div>
        <div class="aw-form" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
          <label><span>Monthly UZS</span><input type="number" data-k="monthlyPriceUZS" value="${p.monthlyPriceUZS}"/></label>
          <label><span>Yearly UZS</span><input type="number" data-k="yearlyPriceUZS" value="${p.yearlyPriceUZS}"/></label>
          <label><span>Commission %</span><input type="number" step="0.1" data-k="commission" value="${p.commission}"/></label>
          <label><span>Websites/month</span><input type="number" data-k="websitesPerMonth" value="${p.websitesPerMonth}"/></label>
          <label class="aw-checkbox"><input type="checkbox" data-k="badge" ${p.badge ? 'checked' : ''}/><span>Badge</span></label>
          <label class="aw-checkbox"><input type="checkbox" data-k="enabled" ${p.enabled ? 'checked' : ''}/><span>Enabled</span></label>
        </div>
        <button class="aw-btn aw-btn-primary" data-save="${esc(p.id)}" style="margin-top:10px">Save</button>
      </div>
    `).join('');

    host.querySelectorAll('button[data-save]').forEach(b => {
      b.addEventListener('click', async () => {
        const card = host.querySelector(`[data-plan="${b.dataset.save}"]`);
        const payload = { id: b.dataset.save };
        card.querySelectorAll('[data-k]').forEach(el => {
          const k = el.dataset.k;
          if (el.type === 'checkbox') payload[k] = el.checked;
          else payload[k] = Number(el.value);
        });
        const r = await API.adminPut('premium/plans', payload);
        if (r.success) toast('Saved.', 'success');
        else toast(r.message, 'error');
      });
    });
  }

  load();
})();
</script>
</body></html>
