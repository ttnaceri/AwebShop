<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Logs — Admin</title>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-toolbar">
      <input id="l-search" placeholder="Filter by action, admin, target…"/>
      <button class="aw-btn aw-btn-ghost" id="l-refresh">Refresh</button>
      <button class="aw-btn aw-btn-ghost" id="l-export">Export CSV</button>
    </div>
    <div id="logs-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/admin-console.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Logs', 'Admin audit log');

  let all = [];
  const host = document.getElementById('logs-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const r = await API.adminLogs();
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed.</div>'; return; }
    all = r.data.items.slice().reverse();
    render();
  }

  function render() {
    const q = document.getElementById('l-search').value.trim().toLowerCase();
    let list = all.slice();
    if (q) list = list.filter(l =>
      (l.action || '').toLowerCase().includes(q) ||
      (l.adminId || '').toLowerCase().includes(q) ||
      (l.target || '').toLowerCase().includes(q)
    );

    renderTable(host,
      [
        { label: 'Time', render: r => fmtDateShort(r.timestamp) },
        { label: 'Admin', render: r => esc(r.adminId) },
        { label: 'Action', render: r => esc(r.action) },
        { label: 'Target', render: r => esc(r.target || '—') },
        { label: 'Meta', render: r => `<code>${esc(JSON.stringify(r.meta || {}))}</code>` }
      ],
      list,
      { emptyText: 'No logs.' }
    );
  }

  function exportCsv() {
    const rows = [['timestamp','adminId','action','target','meta']];
    all.forEach(l => rows.push([l.timestamp, l.adminId, l.action, l.target || '', JSON.stringify(l.meta || {})]));
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'awebshop-admin-logs.csv';
    a.click();
  }

  document.getElementById('l-search').addEventListener('input', render);
  document.getElementById('l-refresh').addEventListener('click', load);
  document.getElementById('l-export').addEventListener('click', exportCsv);

  load();
})();
</script>
</body>
</html>
