<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Logs — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-toolbar">
      <input id="l-search" placeholder="Search logs…"/>
      <button class="aw-btn aw-btn-ghost" id="l-refresh">Refresh</button>
    </div>
    <div id="logs-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Logs', 'Admin audit log');

  let all = [];
  const host = document.getElementById('logs-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const r = await API.adminGet('logs');
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed: ' + esc(r.message || '') + '</div>'; return; }
    all = (r.data.items || []).slice().reverse();
    render();
  }

  function render() {
    const q = document.getElementById('l-search').value.trim().toLowerCase();
    const list = q ? all.filter(l =>
      (l.action || '').toLowerCase().includes(q) ||
      (l.adminId || '').toLowerCase().includes(q)
    ) : all;

    renderTable(host,
      [
        { label: 'Time', render: r => fmtDateShort(r.timestamp) },
        { label: 'Admin', render: r => esc(r.adminId) },
        { label: 'Action', render: r => esc(r.action) },
        { label: 'Target', render: r => esc(r.target || '—') }
      ],
      list,
      { emptyText: 'No logs.' }
    );
  }

  document.getElementById('l-search').addEventListener('input', render);
  document.getElementById('l-refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
