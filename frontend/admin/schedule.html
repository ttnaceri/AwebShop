<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Schedule — Admin</title>
<link rel="stylesheet" href="../css/main.css"/><link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/><link rel="stylesheet" href="../css/responsive.css"/></head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content"><p id="admin-subtitle" class="admin-sub"></p></div>
</div>
<script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script>
<script src="../js/admin.js"></script><script src="../components/modals.js"></script><script src="../components/admin-console.js"></script>
<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Schedule', 'Scheduled tasks: announcement, note, backup, discount');

  const content = document.querySelector('.admin-content');
  content.insertAdjacentHTML('beforeend', `
    <div class="admin-toolbar">
      <input id="sc-title" placeholder="Title"/>
      <select id="sc-type">
        <option value="announcement">Announcement</option>
        <option value="note">Note</option>
        <option value="backup">Backup</option>
        <option value="discount">Discount</option>
      </select>
      <input id="sc-when" placeholder="When (ISO date)"/>
      <button class="aw-btn aw-btn-primary" id="sc-add">+ Schedule</button>
      <button class="aw-btn aw-btn-ghost" id="sc-refresh">Refresh</button>
    </div>
    <div id="sc-host"></div>
  `);

  async function load() {
    const r = await API.adminGet('schedule');
    if (!r.success) return;
    renderTable(document.getElementById('sc-host'),
      [
        { label: 'Type', render: x => esc(x.type) },
        { label: 'Title', render: x => esc(x.title) },
        { label: 'Scheduled at', render: x => x.scheduledAt ? fmtDateShort(x.scheduledAt) : '—' },
        { label: 'Status', render: x => statusPill(x.status) },
        { label: 'Actions', render: x => `<button class="admin-btn-sm bad" data-del="${esc(x.id)}">Delete</button>` }
      ], r.data.items, { emptyText: 'No scheduled tasks.' }
    );
    document.querySelectorAll('button[data-del]').forEach(b => {
      b.addEventListener('click', async () => { await API.adminDelete('schedule', { id: b.dataset.del }); load(); });
    });
  }

  document.getElementById('sc-add').addEventListener('click', async () => {
    const title = document.getElementById('sc-title').value.trim();
    const type = document.getElementById('sc-type').value;
    const scheduledAt = document.getElementById('sc-when').value || null;
    if (!title) return toast('Title required.', 'error');
    const r = await API.adminPost('schedule', { title, type, scheduledAt });
    if (r.success) { toast('Scheduled.', 'success'); load(); }
    else toast(r.message, 'error');
  });
  document.getElementById('sc-refresh').addEventListener('click', load);
  load();
})();
</script>
</body></html>
