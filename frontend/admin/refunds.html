<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Refunds — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-toolbar">
      <button class="aw-btn aw-btn-ghost" id="r-refresh">Refresh</button>
    </div>
    <div id="refunds-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Refunds', 'Refund requests');

  const host = document.getElementById('refunds-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const d = await API.adminGet('refunds');
    if (!d.success) {
      // Backendda refunds endpoint bo'lmasa — bo'sh ko'rsatamiz
      host.innerHTML = '<div class="admin-empty">No refunds yet.</div>';
      return;
    }
    const items = d.data.items || [];
    renderTable(host,
      [
        { label: 'ID', render: x => '<code>' + esc(x.id) + '</code>' },
        { label: 'User', render: x => esc(x.userId) },
        { label: 'Amount', render: x => (x.amountUZS || 0) + " so'm" },
        { label: 'Card', render: x => esc(x.cardNumber || '—') },
        { label: 'Status', render: x => statusPill(x.status) },
        { label: 'Created', render: x => fmtDateShort(x.createdAt) }
      ],
      items,
      { emptyText: 'No refunds yet.' }
    );
  }

  document.getElementById('r-refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
