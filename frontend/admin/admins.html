<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Admins — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-toolbar">
      <input id="a-user" placeholder="User ID (9-digit)"/>
      <select id="a-role">
        <option value="moderator">Moderator</option>
        <option value="admin">Admin</option>
        <option value="super_admin">Super Admin</option>
      </select>
      <button class="aw-btn aw-btn-primary" id="a-add">+ Add admin</button>
      <button class="aw-btn aw-btn-ghost" id="a-refresh">Refresh</button>
    </div>
    <div id="admins-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Admins', 'Roles and permissions');

  const host = document.getElementById('admins-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const r = await API.adminGet('admins');
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed: ' + esc(r.message || '') + '</div>'; return; }
    render(r.data.items || []);
  }

  function render(items) {
    renderTable(host,
      [
        { label: 'Admin ID', render: x => '<code>' + esc(x.id) + '</code>' },
        { label: 'User ID', render: x => esc(x.userId) },
        { label: 'Role', render: x => '<span class="admin-role-pill">' + esc(x.role) + '</span>' },
        { label: 'Code', render: x => '<code>' + esc(x.code || '—') + '</code>' },
        { label: 'Status', render: x => x.disabled ? statusPill('cancelled') : statusPill('active') },
        { label: 'Actions', render: x => '<div class="admin-actions"><button class="admin-btn-sm bad" data-del="' + esc(x.id) + '">Remove</button></div>' }
      ],
      items,
      { emptyText: 'No admins yet.' }
    );

    host.querySelectorAll('button[data-del]').forEach(b => {
      b.addEventListener('click', async () => {
        if (!(await confirmModal('Remove admin?', 'Access will be revoked.'))) return;
        const r = await API.adminDelete('admins', { id: b.dataset.del });
        if (r.success) { toast('Removed.', 'success'); load(); }
        else toast(r.message, 'error');
      });
    });
  }

  document.getElementById('a-add').addEventListener('click', async () => {
    const userId = document.getElementById('a-user').value.trim();
    const role = document.getElementById('a-role').value;
    if (!userId) return toast('Enter user ID.', 'error');
    const r = await API.adminPost('admins', { userId, role });
    if (r.success) { toast('Added.', 'success'); document.getElementById('a-user').value = ''; load(); }
    else toast(r.message, 'error');
  });
  document.getElementById('a-refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
