<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Websites — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-toolbar">
      <input id="w-search" placeholder="Search websites…"/>
      <select id="w-filter">
        <option value="">All statuses</option>
        <option value="active">Active</option>
        <option value="sold">Sold</option>
        <option value="pending_payment">Pending</option>
      </select>
      <button class="aw-btn aw-btn-ghost" id="w-refresh">Refresh</button>
    </div>
    <div id="ws-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Websites', 'All marketplace listings');

  let all = [];
  const host = document.getElementById('ws-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const r = await API.adminGet('websites');
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed: ' + esc(r.message || '') + '</div>'; return; }
    all = r.data.items || [];
    render();
  }

  function render() {
    const q = document.getElementById('w-search').value.trim().toLowerCase();
    const f = document.getElementById('w-filter').value;
    let list = all.slice();
    if (q) list = list.filter(w =>
      (w.name || '').toLowerCase().includes(q) ||
      (w.webId || '').toLowerCase().includes(q) ||
      (w.domain || '').toLowerCase().includes(q)
    );
    if (f) list = list.filter(w => w.status === f);

    renderTable(host,
      [
        { label: 'Web ID', render: r => '<code>' + esc(r.webId) + '</code>' },
        { label: 'Name', render: r => esc(r.name) },
        { label: 'Domain', render: r => esc(r.domain) },
        { label: 'Type', render: r => esc(r.type || 'frontend') },
        { label: 'Price AWC', render: r => (r.priceAWC || 0).toFixed(2) },
        { label: 'Price UZS', render: r => fmtMoney(r.priceUZS) },
        { label: 'Sale', render: r => r.saleType === 'safe' ? '<span class="aw-badge aw-badge-safe">Safe</span>' : '<span class="aw-badge aw-badge-fast">Fast</span>' },
        { label: 'Status', render: r => statusPill(r.status) },
        { label: 'Views', render: r => r.views || 0 },
        { label: 'Created', render: r => fmtDateShort(r.createdAt) }
      ],
      list,
      { emptyText: 'No websites.' }
    );
  }

  document.getElementById('w-search').addEventListener('input', render);
  document.getElementById('w-filter').addEventListener('change', render);
  document.getElementById('w-refresh').addEventListener('click', load);

  load();
})();
</script>
</body>
</html>
