<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Promocodes — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-toolbar">
      <button class="aw-btn aw-btn-primary" id="p-add">+ New promocode</button>
      <button class="aw-btn aw-btn-ghost" id="p-refresh">Refresh</button>
    </div>
    <div id="promo-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Promocodes', 'Discount codes');

  const host = document.getElementById('promo-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const r = await API.adminGet('promocodes');
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed: ' + esc(r.message || '') + '</div>'; return; }
    render(r.data.items || []);
  }

  function render(items) {
    renderTable(host,
      [
        { label: 'Code', render: x => '<code>' + esc(x.code) + '</code>' },
        { label: 'Type', render: x => esc(x.type) },
        { label: 'Value', render: x => esc(x.value) },
        { label: 'Uses', render: x => (x.usedCount || 0) + ' / ' + (x.maxUses || '∞') },
        { label: 'Status', render: x => x.enabled ? statusPill('active') : statusPill('cancelled') },
        { label: 'Created', render: x => fmtDateShort(x.createdAt) },
        { label: 'Actions', render: x => '<div class="admin-actions"><button class="admin-btn-sm bad" data-del="' + esc(x.id) + '">Delete</button></div>' }
      ],
      items,
      { emptyText: 'No promocodes yet.' }
    );
    host.querySelectorAll('button[data-del]').forEach(b => {
      b.addEventListener('click', async () => {
        if (!(await confirmModal('Delete promocode?', 'Proceed?'))) return;
        const r = await API.adminDelete('promocodes', { id: b.dataset.del });
        if (r.success) { toast('Deleted.', 'success'); load(); }
        else toast(r.message, 'error');
      });
    });
  }

  document.getElementById('p-add').addEventListener('click', () => {
    openModal({
      title: 'New promocode',
      body: '<div class="aw-form">' +
        '<label><span>Code (uppercase)</span><input id="p-code" placeholder="WELCOME10"/></label>' +
        '<label><span>Type</span><select id="p-type">' +
        '<option value="percent">Percent (%)</option>' +
        '<option value="fixed">Fixed (UZS)</option>' +
        '</select></label>' +
        '<label><span>Value</span><input type="number" id="p-value" value="10"/></label>' +
        '<label><span>Max uses (0 = unlimited)</span><input type="number" id="p-max" value="0"/></label>' +
        '<label><span>Expires at (ISO, optional)</span><input id="p-exp"/></label>' +
        '<label class="aw-checkbox"><input type="checkbox" id="p-enabled" checked/><span>Enabled</span></label>' +
        '</div>',
      actions: [
        { label: 'Cancel', className: 'aw-btn-ghost', onClick: () => closeModal() },
        { label: 'Create', className: 'aw-btn-primary', onClick: async () => {
          const r = await API.adminPost('promocodes', {
            code: document.getElementById('p-code').value,
            type: document.getElementById('p-type').value,
            value: Number(document.getElementById('p-value').value),
            maxUses: Number(document.getElementById('p-max').value),
            expiresAt: document.getElementById('p-exp').value || null,
            enabled: document.getElementById('p-enabled').checked
          });
          if (r.success) { toast('Created.', 'success'); closeModal(); load(); }
          else toast(r.message, 'error');
        }}
      ]
    });
  });
  document.getElementById('p-refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
