<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Promocodes — Admin</title>
<link rel="icon" type="image/png" href="/frontend/assets/image/logo.png">
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
  </div>
</div>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>
<script src="../components/admin-console.js"></script>
<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  buildCrudPage({
    title: 'Promocodes',
    subtitle: 'Discount codes and usage tracking',
    endpoint: 'promocodes',
    idField: 'id',
    columns: [
      { label: 'Code', render: r => `<code>${esc(r.code)}</code>` },
      { label: 'Type', render: r => esc(r.type) },
      { label: 'Value', render: r => esc(r.value) },
      { label: 'Uses', render: r => `${r.usedCount || 0} / ${r.maxUses || '∞'}` },
      { label: 'Expires', render: r => r.expiresAt ? fmtDateShort(r.expiresAt) : '—' },
      { label: 'Status', render: r => r.enabled ? statusPill('active') : statusPill('cancelled') }
    ],
    formFields: [
      { key: 'code', label: 'Code (uppercase)', type: 'text' },
      { key: 'type', label: 'Type', type: 'select', options: [
        { value: 'percent', label: 'Percent (%)' },
        { value: 'fixed', label: 'Fixed (UZS)' }
      ], default: 'percent' },
      { key: 'value', label: 'Value', type: 'number', default: 5 },
      { key: 'maxUses', label: 'Max uses (0 = unlimited)', type: 'number', default: 0 },
      { key: 'expiresAt', label: 'Expires at (ISO, optional)', type: 'text' },
      { key: 'enabled', label: 'Enabled', type: 'checkbox', default: true }
    ]
  });
})();
</script>
</body>
</html>
