<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Subscriptions — Admin</title>
<link rel="stylesheet" href="../css/main.css"/><link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/><link rel="stylesheet" href="../css/responsive.css"/></head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content"><p id="admin-subtitle" class="admin-sub"></p></div>
</div>
<script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script>
<script src="../js/admin.js"></script><script src="../components/admin-console.js"></script>
<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Premium Subscriptions', 'All user subscriptions');

  const content = document.querySelector('.admin-content');
  content.insertAdjacentHTML('beforeend', `<div id="ps-host"></div>`);

  const r = await API.adminGet('premium/subscriptions');
  if (r.success) {
    renderTable(document.getElementById('ps-host'),
      [
        { label: 'User', render: x => esc(x.userId) },
        { label: 'Plan', render: x => esc(x.plan) },
        { label: 'Billing', render: x => esc(x.billingPeriod) },
        { label: 'Status', render: x => statusPill(x.status) },
        { label: 'Ends', render: x => fmtDateShort(x.endDate) },
        { label: 'Created', render: x => fmtDateShort(x.createdAt) }
      ], r.data.items, { emptyText: 'No subscriptions.' }
    );
  }
})();
</script>
</body></html>
