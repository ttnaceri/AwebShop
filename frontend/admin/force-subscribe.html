<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Force Subscribe — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-toolbar">
      <input id="fs-id" placeholder="Channel ID (-100...)"/>
      <input id="fs-name" placeholder="Channel name"/>
      <input id="fs-link" placeholder="https://t.me/channel"/>
      <button class="aw-btn aw-btn-primary" id="fs-add">+ Add</button>
      <button class="aw-btn aw-btn-ghost" id="fs-refresh">Refresh</button>
    </div>
    <div id="fs-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Force Subscribe', 'Telegram channels users must join');

  const host = document.getElementById('fs-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const r = await API.adminGet('force-subscribe');
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed: ' + esc(r.message || '') + '</div>'; return; }
    render(r.data.items || []);
  }

  function render(items) {
    renderTable(host,
      [
        { label: 'Channel ID', render: x => '<code>' + esc(x.channelId) + '</code>' },
        { label: 'Name', render: x => esc(x.channelName) },
        { label: 'Link', render: x => x.channelLink ? '<a href="' + esc(x.channelLink) + '" target="_blank">open</a>' : '—' },
        { label: 'Status', render: x => x.status === 'active' ? statusPill('active') : statusPill('cancelled') },
        { label: 'Actions', render: x => '<div class="admin-actions"><button class="admin-btn-sm bad" data-del="' + esc(x.id) + '">Delete</button></div>' }
      ],
      items,
      { emptyText: 'No channels yet.' }
    );
    host.querySelectorAll('button[data-del]').forEach(b => {
      b.addEventListener('click', async () => {
        if (!(await confirmModal('Delete channel?', 'Proceed?'))) return;
        const r = await API.adminDelete('force-subscribe', { id: b.dataset.del });
        if (r.success) { toast('Deleted.', 'success'); load(); }
        else toast(r.message, 'error');
      });
    });
  }

  document.getElementById('fs-add').addEventListener('click', async () => {
    const channelId = document.getElementById('fs-id').value.trim();
    const channelName = document.getElementById('fs-name').value.trim();
    const channelLink = document.getElementById('fs-link').value.trim();
    if (!channelId || !channelName) return toast('Channel ID and Name required.', 'error');
    const r = await API.adminPost('force-subscribe', { channelId, channelName, channelLink, status: 'active' });
    if (r.success) {
      toast('Added.', 'success');
      ['fs-id', 'fs-name', 'fs-link'].forEach(id => document.getElementById(id).value = '');
      load();
    } else toast(r.message, 'error');
  });
  document.getElementById('fs-refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
