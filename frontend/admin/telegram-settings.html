<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Telegram — Admin<title><link rel="icon" type="image/png" href="/frontend/assets/image/logo.png">
<link rel="stylesheet" href="../css/main.css"/><link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/><link rel="stylesheet" href="../css/responsive.css"/></head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content"><p id="admin-subtitle" class="admin-sub"></p></div>
</div>
<script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script>
<script src="../js/admin.js"></script><script src="../components/admin-console.js"></script>
<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Telegram Settings', 'Bot notifications and templates');

  const r = await API.adminGet('telegram');
  const t = r.success ? r.data.telegram : {};

  const content = document.querySelector('.admin-content');
  content.insertAdjacentHTML('beforeend', `
    <div class="admin-card">
      <p class="aw-muted">
        Bot token va webhook uchun <code>config.js</code> dan foydalaniladi.
        Bu yerda faqat xabar shablonlari va yoqish/o'chirish holati saqlanadi.
      </p>
      <div class="aw-form">
        <label class="aw-checkbox"><input type="checkbox" id="t-enabled" ${t.enabled?'checked':''}/><span>Enable Telegram notifications</span></label>
        <label><span>Login template</span><textarea id="t-login" rows="2">${esc(t.messageTemplates?.login||'🔔 New login to your AWebShop account.')}</textarea></label>
        <label><span>Order template</span><textarea id="t-order" rows="2">${esc(t.messageTemplates?.order||'🛒 New order: {name}. Order ID: {orderId}')}</textarea></label>
        <label><span>Payment template</span><textarea id="t-pay" rows="2">${esc(t.messageTemplates?.payment||'💳 Payment status: {status}')}</textarea></label>
      </div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="aw-btn aw-btn-primary" id="t-save">Save</button>
        <button class="aw-btn aw-btn-ghost" id="t-test">Send test message</button>
      </div>
    </div>
  `);

  document.getElementById('t-save').addEventListener('click', async () => {
    const payload = {
      enabled: document.getElementById('t-enabled').checked,
      messageTemplates: {
        login: document.getElementById('t-login').value,
        order: document.getElementById('t-order').value,
        payment: document.getElementById('t-pay').value
      }
    };
    const r2 = await API.adminPut('telegram', payload);
    if (r2.success) toast('Saved.', 'success');
    else toast(r2.message, 'error');
  });

  document.getElementById('t-test').addEventListener('click', async () => {
    const r2 = await API.adminPost('telegram/test', {});
    if (r2.success) toast('Test message sent.', 'success');
    else toast(r2.message, 'error');
  });
})();
</script>
</body></html>
