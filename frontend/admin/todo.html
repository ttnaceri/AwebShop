<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Todo — Admin<title><link rel="icon" type="image/png" href="/frontend/assets/image/logo.png">
<link rel="stylesheet" href="../css/main.css"/><link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/console.css"/><link rel="stylesheet" href="../css/responsive.css"/></head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content"><p id="admin-subtitle" class="admin-sub"></p></div>
</div>
<script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script>
<script src="../js/admin.js"></script><script src="../components/admin-console.js"></script>
<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Todo', 'Admin task list');

  const content = document.querySelector('.admin-content');
  content.insertAdjacentHTML('beforeend', `
    <div class="admin-toolbar">
      <input id="td-title" placeholder="New task title"/>
      <button class="aw-btn aw-btn-primary" id="td-add">+ Add</button>
      <button class="aw-btn aw-btn-ghost" id="td-refresh">Refresh</button>
    </div>
    <div id="td-host"></div>
  `);

  async function load() {
    const r = await API.adminGet('todo');
    if (!r.success) return;
    const items = r.data.items;
    const host = document.getElementById('td-host');
    if (!items.length) { host.innerHTML = '<div class="admin-empty">No tasks.</div>'; return; }
    host.innerHTML = items.map(t => `
      <div class="admin-card" style="display:flex;align-items:center;gap:10px">
        <input type="checkbox" data-toggle="${esc(t.id)}" ${t.status==='done'?'checked':''}/>
        <div style="flex:1;text-decoration:${t.status==='done'?'line-through':'none'}">${esc(t.title)}</div>
        <button class="admin-btn-sm bad" data-del="${esc(t.id)}">Delete</button>
      </div>
    `).join('');
    host.querySelectorAll('input[data-toggle]').forEach(el => {
      el.addEventListener('change', async () => {
        await API.adminPut('todo', { id: el.dataset.toggle, status: el.checked ? 'done' : 'open' });
        load();
      });
    });
    host.querySelectorAll('button[data-del]').forEach(b => {
      b.addEventListener('click', async () => { await API.adminDelete('todo', { id: b.dataset.del }); load(); });
    });
  }

  document.getElementById('td-add').addEventListener('click', async () => {
    const title = document.getElementById('td-title').value.trim();
    if (!title) return;
    await API.adminPost('todo', { title });
    document.getElementById('td-title').value = '';
    load();
  });
  document.getElementById('td-refresh').addEventListener('click', load);
  load();
})();
</script>
</body></html>
