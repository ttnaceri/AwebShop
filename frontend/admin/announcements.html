<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Announcements — Admin</title>
<link rel="icon" type="image/png" href="../assets/image/logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<link rel="stylesheet" href="../css/main.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<link rel="stylesheet" href="../css/navbar.css"/>
<link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body class="admin-body">
<aside id="admin-sidebar" class="admin-sidebar"></aside>
<div class="admin-main">
  <header id="admin-topbar" class="admin-topbar"></header>
  <div class="admin-content">
    <p id="admin-subtitle" class="admin-sub"></p>
    <div class="admin-toolbar">
      <button class="aw-btn aw-btn-primary" id="a-add">+ New announcement</button>
      <button class="aw-btn aw-btn-ghost" id="a-refresh">Refresh</button>
    </div>
    <div id="ann-host"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../components/modals.js"></script>

<script>
(async () => {
  await loadRates();
  if (!(await Admin.requireAdmin())) return;
  adminPage('Announcements', 'Broadcast messages');

  const host = document.getElementById('ann-host');

  async function load() {
    host.innerHTML = '<div class="admin-loading">Loading…</div>';
    const r = await API.adminGet('announcements');
    if (!r.success) { host.innerHTML = '<div class="admin-empty">Failed: ' + esc(r.message || '') + '</div>'; return; }
    render(r.data.items || []);
  }

  function render(items) {
    renderTable(host,
      [
        { label: 'Title', render: x => esc(x.title) },
        { label: 'Target', render: x => esc(x.target) },
        { label: 'Status', render: x => statusPill(x.status === 'published' ? 'active' : 'pending') },
        { label: 'Created', render: x => fmtDateShort(x.createdAt) },
        { label: 'Actions', render: x => '<div class="admin-actions"><button class="admin-btn-sm bad" data-del="' + esc(x.id) + '">Delete</button></div>' }
      ],
      items,
      { emptyText: 'No announcements yet.' }
    );
    host.querySelectorAll('button[data-del]').forEach(b => {
      b.addEventListener('click', async () => {
        if (!(await confirmModal('Delete?', 'Proceed?'))) return;
        const r = await API.adminDelete('announcements', { id: b.dataset.del });
        if (r.success) { toast('Deleted.', 'success'); load(); }
        else toast(r.message, 'error');
      });
    });
  }

  document.getElementById('a-add').addEventListener('click', () => {
    openModal({
      title: 'New announcement',
      body: '<div class="aw-form">' +
        '<label><span>Title</span><input id="a-title"/></label>' +
        '<label><span>Body</span><textarea id="a-body" rows="5"></textarea></label>' +
        '<label><span>Target</span><select id="a-target">' +
        '<option value="users">Users</option><option value="admins">Admins</option><option value="collaborators">Collaborators</option>' +
        '</select></label>' +
        '</div>',
      actions: [
        { label: 'Cancel', className: 'aw-btn-ghost', onClick: () => closeModal() },
        { label: 'Create', className: 'aw-btn-primary', onClick: async () => {
          const r = await API.adminPost('announcements', {
            title: document.getElementById('a-title').value,
            body: document.getElementById('a-body').value,
            target: document.getElementById('a-target').value
          });
          if (r.success) { toast('Created.', 'success'); closeModal(); load(); }
          else toast(r.message, 'error');
        }}
      ]
    });
  });
  document.getElementById('a-refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
